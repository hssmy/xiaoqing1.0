  XQ.linked = function (n) {
    return Number(n || 0).toLocaleString('zh-CN');
  };
  XQ.uid = function (p) {
    return (p || 'id') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  };
  XQ.typewriter = function (el, text, speed, done) {
    if (!el) return;
    let i = 0;
    el.textContent = '';
    const step = Math.max(1, Math.round(text.length / 90));
    const timer = setInterval(() => {
      i += step;
      el.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(timer);
        el.textContent = text;
        if (done) done();
      }
    }, speed || 24);
    return timer;
  };

  /* ---------- toast ---------- */
  XQ.toast = function (msg, type) {
    const root = document.getElementById('toastRoot');
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.innerHTML = XQ.icon(type === 'err' ? 'alert' : type === 'warn' ? 'alert' : 'check') + '<span>' + msg + '</span>';
    root.appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 2600);
  };

  /* ---------- modal ---------- */
  let modalStack = [];
  XQ.modal = function (opt) {
    const root = document.getElementById('modalRoot');
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML =
      '<div class="modal ' + (opt.size || '') + '" role="dialog">' +
        '<div class="modal-head"><div><h3>' + (opt.title || '') + '</h3>' + (opt.sub ? '<p>' + opt.sub + '</p>' : '') + '</div>' +
        '<button class="modal-close" data-close>' + XQ.icon('x') + '</button></div>' +
        '<div class="modal-body">' + (opt.body || '') + '</div>' +
        (opt.footer === false ? '' : '<div class="modal-foot">' + (opt.footer || '<button class="btn" data-close>关闭</button>') + '</div>') +
      '</div>';
    root.appendChild(mask);
    modalStack.push(mask);
    const close = () => {
      mask.remove();
      modalStack = modalStack.filter(m => m !== mask);
      if (opt.onClose) opt.onClose();
    };
    mask.addEventListener('click', e => {
      if (e.target === mask) close();
      if (e.target.closest('[data-close]')) close();
    });
    const old = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    if (opt.onMount) opt.onMount(mask, close);
    const originalClose = close;
    mask._close = () => { originalClose(); document.body.style.overflow = modalStack.length ? 'hidden' : old; };
    return mask;
  };
  XQ.closeModal = function () {
    const m = modalStack[modalStack.length - 1];
    if (m && m._close) m._close();
  };
  XQ.confirm = function (opt) {
    XQ.modal({
      title: opt.title || '请确认',
      body: '<div style="font-size:13px;line-height:1.75;color:var(--ink-2)">' + (opt.body || '') + '</div>',
      footer: '<button class="btn" data-close>取消</button><button class="btn ' + (opt.danger ? 'danger' : 'primary') + '" id="xqConfirmOk">' + (opt.okText || '确定') + '</button>',
      onMount: (mask, close) => {
        mask.querySelector('#xqConfirmOk').addEventListener('click', () => {
          close();
          if (opt.onOk) opt.onOk();
        });
      }
    });
  };

  /* ---------- actions ---------- */
  XQ.actions = {};
  XQ.on = function (name, fn) { XQ.actions[name] = fn; };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = XQ.actions[el.dataset.act];
    if (fn) {
      if (el.tagName !== 'A') e.preventDefault();
      fn(el, e);
    }
  });
  document.addEventListener('submit', e => {
    const form = e.target.closest('form[data-act]');
    if (!form) return;
    e.preventDefault();
    const fn = XQ.actions[form.dataset.act];
    if (fn) fn(form, e);
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-change]');
    if (!el) return;
    const fn = XQ.actions[el.dataset.change];
    if (fn) fn(el, e);
  });
  document.addEventListener('input', e => {
    const el = e.target.closest('[data-input]');
    if (!el) return;
    const fn = XQ.actions[el.dataset.input];
    if (fn) fn(el, e);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (modalStack.length) { XQ.closeModal(); return; }
      if (XQ.closeAssistant) XQ.closeAssistant();
      if (XQ.closePalette) XQ.closePalette();
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (XQ.openPalette) XQ.openPalette();
    }
  });

  /* ---------- charts ---------- */
  const CH = {};
  CH.donut = function (items, size, thickness) {
    size = size || 132; thickness = thickness || 15;
    const total = items.reduce((s, i) => s + i.value, 0) || 1;
    const r = (size - thickness) / 2;
    const c = 2 * Math.PI * r;
    let off = 0;
    const segs = items.map(i => {
      const len = (i.value / total) * c;
      const s = '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" stroke="' + i.color + '" stroke-width="' + thickness + '" stroke-dasharray="' + Math.max(0, len - 2.5) + ' ' + c + '" stroke-dashoffset="' + (-off) + '" stroke-linecap="round" transform="rotate(-90 ' + (size / 2) + ' ' + (size / 2) + ')"/>';
      off += len;
      return s;
    }).join('');
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" stroke="#f0f4f2" stroke-width="' + thickness + '"/>' + segs + '</svg>';
  };
  CH.line = function (items, opt) {
    opt = opt || {};
    const w = opt.w || 520, h = opt.h || 150, padL = 8, padR = 8, padT = 14, padB = 24;
    const vals = items.map(i => i.value);
    const max = Math.max.apply(null, vals.concat([1])) * 1.12;
    const min = Math.min.apply(null, vals.concat([0])) * 0.9;
    const span = max - min || 1;
    const xs = items.map((it, i) => padL + (w - padL - padR) * (i / Math.max(1, items.length - 1)));
    const ys = items.map(it => padT + (h - padT - padB) * (1 - (it.value - min) / span));
    const pts = xs.map((x, i) => x + ',' + ys[i]).join(' ');
    const area = padL + ',' + (h - padB) + ' ' + pts + ' ' + (w - padR) + ',' + (h - padB);
    const grid = [0, 1, 2, 3].map(i => {
      const y = padT + (h - padT - padB) * i / 3;
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="#eef3f1" stroke-width="1"/>';
    }).join('');
    const dots = xs.map((x, i) => '<circle cx="' + x + '" cy="' + ys[i] + '" r="3" fill="#fff" stroke="' + (opt.color || '#0f9d76') + '" stroke-width="2"/>').join('');
    const labels = items.map((it, i) => '<text x="' + xs[i] + '" y="' + (h - 7) + '" font-size="9" fill="#98a7a2" text-anchor="middle">' + it.label + '</text>').join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' + grid +
      '<defs><linearGradient id="lg' + (opt.id || 'a') + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + (opt.color || '#0f9d76') + '" stop-opacity=".18"/><stop offset="1" stop-color="' + (opt.color || '#0f9d76') + '" stop-opacity="0"/></linearGradient></defs>' +
      '<polygon points="' + area + '" fill="url(#lg' + (opt.id || 'a') + ')"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="' + (opt.color || '#0f9d76') + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots + labels + '</svg>';
  };
  CH.bars = function (items, opt) {
    opt = opt || {};
    const w = opt.w || 520, h = opt.h || 160, padB = 26, padT = 12;
    const max = Math.max.apply(null, items.map(i => Math.max(i.value, i.value2 || 0)).concat([1]));
    const n = items.length;
    const gap = 18;
    const bw = Math.max(8, (w - gap * (n + 1)) / n / (items[0] && items[0].value2 != null ? 2.2 : 1));
    const bars = items.map((it, i) => {
      const x = gap + i * ((w - gap) / n);
      const h1 = (h - padT - padB) * (it.value / max);
      const h2 = it.value2 != null ? (h - padT - padB) * (it.value2 / max) : 0;
      const b1 = '<rect x="' + x + '" y="' + (h - padB - h1) + '" width="' + bw + '" height="' + Math.max(1, h1) + '" rx="3" fill="' + (it.color || '#0f9d76') + '"/>';
      const b2 = it.value2 != null ? '<rect x="' + (x + bw + 3) + '" y="' + (h - padB - h2) + '" width="' + bw + '" height="' + Math.max(1, h2) + '" rx="3" fill="#dbe6e2"/>' : '';
      const t = '<text x="' + (x + bw / 2 + (it.value2 != null ? bw / 2 : 0)) + '" y="' + (h - 9) + '" font-size="9" fill="#98a7a2" text-anchor="middle">' + it.label + '</text>';
      return b2 + b1 + t;
    }).join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '">' + bars + '</svg>';
  };
  CH.ring = function (percent, size, color, label) {
    size = size || 90;
    const st = 7, r = (size - st) / 2, c = 2 * Math.PI * r;
    const p = Math.max(0, Math.min(100, percent));
    return '<div class="ring" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg width="' + size + '" height="' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#eef3f1" stroke-width="' + st + '"/><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + (color || '#0f9d76') + '" stroke-width="' + st + '" stroke-linecap="round" stroke-dasharray="' + (c * p / 100) + ' ' + c + '"/></svg>' +
      '<div class="rv"><b style="font-size:' + Math.round(size / 4.2) + 'px;font-weight:700">' + Math.round(p) + '%</b>' + (label ? '<span class="tiny muted">' + label + '</span>' : '') + '</div></div>';
  };
  XQ.chart = CH;

  /* ---------- export ---------- */
  XQ.download = function (name, content, mime) {
    const blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  };
  const docStyle = 'body{font-family:"PingFang SC","Microsoft YaHei",serif;color:#222;line-height:1.8;padding:40px 48px;font-size:12.5px}h1{font-size:20px;text-align:center;letter-spacing:2px;margin:0 0 6px}h2{font-size:14px;margin:18px 0 6px;border-left:3px solid #0f9d76;padding-left:8px}h3{font-size:13px;margin:12px 0 4px}p{margin:0 0 5px;text-indent:2em}table{width:100%;border-collapse:collapse;font-size:11px;margin:8px 0}th,td{border:1px solid #ddd;padding:6px 8px;text-align:left}th{background:#f5f9f8}.meta{text-align:center;color:#888;font-size:10.5px;margin-bottom:18px}.tag{display:inline-block;border:1px solid #ddd;border-radius:3px;padding:0 4px;font-size:9px;color:#666;margin-left:4px}.foot{margin-top:26px;border-top:1px solid #eee;padding-top:8px;color:#999;font-size:9.5px}';
  XQ.exportWord = function (title, bodyHTML) {
    const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' + docStyle + '</style></head><body><h1>' + esc(title) + '</h1>' + bodyHTML + '<div class="foot">由「小青」大学生个人 AI 助理 1.0 生成 · 青海大学</div></body></html>';
    XQ.download(title + '.doc', '\ufeff' + html, 'application/msword');
    XQ.toast('已导出 Word 文档');
  };
  XQ.printDoc = function (title, bodyHTML) {
    const w = window.open('', '_blank', 'width=900,height=760');
    if (!w) { XQ.toast('浏览器拦截了弹出窗口，请允许后重试', 'warn'); return; }
    w.document.write('<html lang="zh-CN"><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' + docStyle + '@media print{body{padding:0 8mm}}</style></head><body><h1>' + esc(title) + '</h1>' + bodyHTML + '<div class="foot">由「小青」大学生个人 AI 助理 1.0 生成 · ' + XQ.dt.nowISO() + '</div></body></html>');
    w.document.close();
    setTimeout(() => { w.focus(); w.print(); }, 420);
  };
  XQ.exportCSV = function (name, rows) {
    const csv = rows.map(r => r.map(c => {
      const v = String(c == null ? '' : c);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(',')).join('\r\n');
    XQ.download(name + '.csv', '\ufeff' + csv, 'text/csv');
    XQ.toast('已导出 ' + name + '.csv');
  };
  XQ.copy = function (text, msg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => XQ.toast(msg || '已复制')).catch(() => XQ.toast('复制失败', 'err'));
    } else {
      const t = document.createElement('textarea');
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); XQ.toast(msg || '已复制'); } catch (e) { XQ.toast('复制失败', 'err'); }
      t.remove();
    }
  };

  /* ---------- misc ---------- */
  XQ.timeHM = function () {
    const d = new Date();
    return dtPad(d.getHours()) + ':' + dtPad(d.getMinutes());
  };
  function dtPad(n) { return String(n).padStart(2, '0'); }
  XQ.greet = function () {
    const h = new Date().getHours();
    if (h < 6) return '夜深了';
    if (h < 11) return '早上好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  };
  XQ.weekdayCN = d => XQ.dt.weekday(d);
  XQ.sourceMeta = {
    jw: { label: '教务同步', color: '#2f7ceb', bg: '#eaf1fe' },
    pu: { label: 'PU 同步', color: '#e8912d', bg: '#fdf1e3' },
    notice: { label: '通知聚合', color: '#7a5cf0', bg: '#f0edfe' },
    manual: { label: '手动录入', color: '#0f9d76', bg: '#e7f7f0' }
  };
  XQ.catMeta = {
    course: { label: '课程', color: '#2f7ceb', bg: '#eaf1fe' },
    activity: { label: '活动', color: '#e8912d', bg: '#fdf1e3' },
    exam: { label: '考试', color: '#e0576b', bg: '#fdeef0' },
    meeting: { label: '会议', color: '#7a5cf0', bg: '#f0edfe' },
    personal: { label: '个人', color: '#0f9d76', bg: '#e7f7f0' }
  };
  XQ.finCats = {
    '餐饮': { icon: '🍚', color: '#e8912d' },
    '购物': { icon: '🛍️', color: '#e0576b' },
    '学习': { icon: '📚', color: '#2f7ceb' },
    '交通': { icon: '🚌', color: '#0f9d76' },
    '娱乐': { icon: '🎬', color: '#7a5cf0' },
    '竞赛': { icon: '🏆', color: '#d4a017' },
    '生活费': { icon: '💰', color: '#0f9d76' },
    '其他': { icon: '📦', color: '#8b9a95' }
  };
})();

</script>
<script>/* app.js */
/* 小青 1.0 · 应用外壳 / 首页 / 全局助手 */
(function () {
  const XQ = window.XQ;
  const S = () => XQ.store.state;
  XQ.views = {};
  XQ.ui = {
    tab: { schedule: 'calendar', finance: 'overview', research: 'dashboard', study: 'courses' },
    scheduleView: 'week',
    calDate: XQ.dt.todayISO(),
    financeMonth: XQ.dt.month(new Date()),
    researchProject: null,
    studyCourse: null,
    studyNote: 's1',
    mindLayout: 'tree',
    chat: [],
    chatOpen: false,
    paletteOpen: false
  };

  const ROUTES = {
    home: { title: '首页', sub: '一个入口，管好大学生活', icon: 'home' },
    schedule: { title: '个人日程', sub: '通知聚合 · 语音录入 · 冲突检测', icon: 'calendar' },
    finance: { title: '个人财务', sub: '记账 · 预算 · 决算 · 三级预警', icon: 'wallet' },
    research: { title: '科研及竞赛', sub: '覆盖项目全生命周期', icon: 'flask' },
    study: { title: '学习助手', sub: '从课堂录音到可复习的知识体系', icon: 'book' }
  };

  function route() {
    const h = (location.hash || '#/home').replace(/^#\/?/, '');
    const key = h.split('/')[0] || 'home';
    return ROUTES[key] ? key : 'home';
  }

  /* ================= rail ================= */
  function renderRail() {
    const cur = route();
    const st = S();
    const unread = XQ.calc.unread();
    const nav = [
      { k: 'home', label: '首页', icon: 'home' },
      { k: 'schedule', label: '个人日程', icon: 'calendar', badge: unread || '' },
      { k: 'finance', label: '个人财务', icon: 'wallet' },
      { k: 'research', label: '科研竞赛', icon: 'flask' },
      { k: 'study', label: '学习助手', icon: 'book', beta: 'AI' }
    ];
    document.getElementById('rail').innerHTML =
      '<div class="brand"><div class="brand-mark">青</div><div class="brand-text"><div class="brand-name">小青</div><div class="brand-tag">个人 AI 助理 · 1.0</div></div></div>' +
      '<div class="school-chip"><i class="dot"></i>' + XQ.esc(st.user.school) + ' · ' + st.user.grade + '</div>' +
      '<div class="nav-label">我的空间</div>' +
      nav.map(n =>
        '<a class="nav-item ' + (cur === n.k ? 'active' : '') + '" href="#/' + n.k + '">' + XQ.icon(n.icon) +
          '<span class="nav-text">' + n.label + '</span>' +
          (n.badge ? '<span class="nav-badge">' + n.badge + '</span>' : '') +
          (n.beta ? '<span class="nav-beta">' + n.beta + '</span>' : '') +
        '</a>'
      ).join('') +
      '<div class="nav-label" style="margin-top:14px">更多</div>' +
      '<button class="nav-item" data-act="openSettings">' + XQ.icon('settings') + '<span class="nav-text">设置与隐私</span></button>' +
      '<button class="nav-item" data-act="openHelp">' + XQ.icon('question') + '<span class="nav-text">帮助与原型说明</span></button>' +
      '<div class="rail-foot">' +
        '<div class="mini-status"><i class="pulse"></i><div><b>小青在线</b><span>已同步 ' + XQ.calc.unread() + ' 条未读通知</span></div></div>' +
        '<button class="user-card" data-act="openProfile"><div class="avatar">' + XQ.esc(st.user.short) + '</div><div><div class="un">' + XQ.esc(st.user.name) + '</div><div class="um">' + XQ.esc(st.user.major) + '</div></div></button>' +
      '</div>';
  }

  /* ================= topbar ================= */
  function renderTopbar() {
    const cur = route();
    const r = ROUTES[cur];
    document.getElementById('topbar').innerHTML =
      '<div class="tb-left"><div class="tb-title">' + r.title + '</div><div class="tb-sub">' + r.sub + '</div></div>' +
      '<div class="tb-right">' +
        '<button class="search-btn" data-act="openPalette">' + XQ.icon('search') + '<span>搜索功能、日程、笔记…</span><span class="kbd">⌘ K</span></button>' +
        '<button class="icon-btn" data-act="openNotifications" title="通知">' + XQ.icon('bell') + (XQ.calc.unread() ? '<i class="badge-dot"></i>' : '') + '</button>' +
        '<button class="ai-btn" data-act="openAssistant">' + XQ.icon('sparkle') + '<span>问小青</span></button>' +
      '</div>';
  }

  /* ================= router ================= */
  XQ.render = function (scroll) {
    renderRail();
    renderTopbar();
    const key = route();
    const el = document.getElementById('view');
    const fn = XQ.views[key] || (() => '<div class="empty">页面不存在</div>');
    el.innerHTML = fn();
    if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  XQ.go = function (path) {
    if (location.hash === '#/' + path) { XQ.render(); return; }
    location.hash = '#/' + path;
  };
  XQ.on('nav', el => {
    const to = el.dataset.to;
    if (el.dataset.tab) XQ.ui.tab[to] = el.dataset.tab;
    XQ.go(to);
  });

  /* ================= shared computed ================= */
  XQ.conflicts = function () {
    const groups = {};
    S().schedule.events.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
    const out = [];
    Object.keys(groups).forEach(date => {
      const arr = groups[date].slice().sort((a, b) => a.start.localeCompare(b.start));
      for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
          if (arr[j].start >= arr[i].end) break;
          out.push({ date, a: arr[i], b: arr[j] });
        }
      }
    });
    return out.filter(c => c.date >= XQ.dt.todayISO());
  };
  XQ.addEvent = function (ev) {
    const e = Object.assign({
      id: XQ.uid('e'), title: '新日程', date: XQ.dt.todayISO(), start: '09:00', end: '10:00',
      location: '', source: 'manual', category: 'personal', priority: 'normal', reminder: 15, note: ''
    }, ev);
    S().schedule.events.push(e);
    XQ.store.save();
    return e;
  };
  XQ.addTx = function (tx) {
    const t = Object.assign({
      id: XQ.uid('t'), type: 'expense', date: XQ.dt.todayISO(), category: '其他',
      amount: 0, note: '记一笔', method: '手动', time: XQ.timeHM()
    }, tx);
    t.amount = Number(t.amount) || 0;

    const budget = st.finance.monthlyBudget;

  function weekStartISO() { return XQ.dt.iso(XQ.dt.weekStart()); }
  function weekEndISO() { return XQ.dt.iso(XQ.dt.addDays(XQ.dt.weekStart(), 6)); }
  function nearestMilestone() {
    const st = S();
    let best = null;
    st.research.projects.filter(p => p.status === '进行中').forEach(p => {
      p.milestones.forEach(m => {
        if (m.status !== 'done') {
          const dd = XQ.dt.diffDays(m.date);
          if (dd >= 0 && (!best || dd < best.days)) best = { title: m.title, short: m.title.length > 6 ? m.title.slice(0, 6) : m.title, date: m.date, days: dd };
        }
      });
    });
    return best;
  }

  function parseEventText(text) {
    let t = text;
    let off = 0;
    if (/后天/.test(t)) off = 2;
    else if (/明天/.test(t)) off = 1;
    else if (/今天/.test(t)) off = 0;
    else {
      const m = t.match(/周([一二三四五六日天])/);
      if (m) {
        const map = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 0, '天': 0 };
        const target = map[m[1]];
        const cur = new Date().getDay();
        let diff = (target - cur + 7) % 7;
        if (diff === 0) diff = 7;
        off = diff;
      }
    }
    let start = '15:00', end = '16:00';
    const tm = t.match(/(上午|下午|晚上|中午)?\s*(\d{1,2})\s*[:点]\s*(\d{1,2})?/);
    if (tm) {
      let h = Number(tm[2]), min = Number(tm[3] || 0);
      if (/(下午|晚上)/.test(tm[1] || '') && h < 12) h += 12;
      if (/(中午)/.test(tm[1] || '') && h < 11) h += 12;
      start = String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
      end = String(Math.min(23, h + 1)).padStart(2, '0') + ':' + String(min).padStart(2, '0');
    }
    let location = '';
    const lm = t.match(/在([^，。,.、]{2,16})(讨论|开会|上课|见面|集合|进行|学习|自习)/);
    if (lm) location = lm[1];
    else {
      const lm2 = t.match(/(?:在|去)([\u4e00-\u9fa5A-Za-z0-9\- ]{2,14})(?:讨论|开会|上课|见面|学习|自习|$)/);
      if (lm2) location = lm2[1];
    }
    let title = t
      .replace(/(今天|明天|后天|周[一二三四五六日天])/g, '')
      .replace(/(上午|下午|晚上|中午)?\s*\d{1,2}\s*[:点]\s*\d{0,2}/g, '')
      .replace(/在[^，。,.、]{2,16}(讨论|开会|上课|见面|集合|进行|学习|自习)?/g, '')
      .replace(/^(我|帮我|请|麻烦|要|想|需要)+/, '')
      .replace(/(记得|提醒我|安排|一下|吧|。|，)/g, '')
      .trim();
    if (!title) title = '新日程';
    if (title.length > 18) title = title.slice(0, 18);
    return { title, date: XQ.D(off), start, end, location, source: 'manual', category: 'personal', note: '由小青语音助手创建', priority: 'normal', reminder: 15 };
  }
  XQ.parseEventText = parseEventText;
  XQ.conflictsFor = function (date, start, end) {

        '<div class="ob-feat"><span class="oi">' + XQ.icon('flask') + '</span>一个工作台管科研</div>' +
        '<div class="ob-feat"><span class="oi">' + XQ.icon('book') + '</span>一套体系管学习</div>' +
      '</div></div><div class="ob-main"><div class="ob-step-tag">WELCOME · 1.0</div><h3>你好，欢迎来到小青</h3><div class="ob-desc">这是一个可交互的产品原型。你可以像使用真实 App 一样，体验日程、财务、科研、学习四个模块，数据会保存在本机。</div>' +
        '<div class="ob-body"><div class="demo-note">' + XQ.icon('info') + '<div>首次进入需要完成一次授权绑定，之后课表、活动、通知会自动同步。正式版通过学校统一身份认证完成。</div></div>' +
        '<div style="margin-top:16px" class="field"><label>怎么称呼你</label><input class="input" value="' + XQ.esc(S().user.name) + '" id="obName"></div></div>' +
        '<div class="ob-foot"><div class="ob-dots"><i class="on"></i><i></i><i></i></div><button class="btn ghost" data-act="ob.skip">跳过</button><button class="btn primary" data-act="ob.next">开始体验 ' + XQ.icon('arrow', 14) + '</button></div></div></div>';
    } else if (obStep === 1) {
      el.innerHTML = '<div class="ob-card"><div class="ob-side"><div class="ob-logo">青</div><h2>一次授权<br>自动同步</h2><p>绑定学校系统后，小青会把课表、活动、通知汇聚到一个入口，并在变更时即时提醒。</p><div class="ob-feats">' +
        '<div class="ob-feat"><span class="oi">' + XQ.icon('shield') + '</span>最小权限 · 可随时撤回</div>' +
        '<div class="ob-feat"><span class="oi">' + XQ.icon('lock') + '</span>敏感数据默认留在本地</div>' +
        '<div class="ob-feat"><span class="oi">' + XQ.icon('eye') + '</span>操作留痕 · 可审计</div>' +
      '</div></div><div class="ob-main"><div class="ob-step-tag">STEP 2 · 数据源</div><h3>选择要连接的系统</h3><div class="ob-desc">演示版会展示同步逻辑，不会真正访问学校系统。</div><div class="ob-body">' +
        '<div class="ob-bind"><div class="obl">CAS</div><div><b>统一身份认证</b><span>一站式服务大厅 · 基础身份</span></div><div class="switch on" data-ob="cas"></div></div>' +
        '<div class="ob-bind"><div class="obl">教务</div><div><b>教务系统</b><span>课表、考试、调课通知</span></div><div class="switch on" data-ob="jw"></div></div>' +
        '<div class="ob-bind"><div class="obl">PU</div><div><b>PU 口袋校园</b><span>第二课堂活动与学分</span></div><div class="switch on" data-ob="pu"></div></div>' +
        '<div class="ob-bind"><div class="obl">青大</div><div><b>掌上青大 / 易班</b><span>通知公告聚合</span></div><div class="switch on" data-ob="portal"></div></div>' +
        '<div class="ob-note">小青仅读取完成日程聚合所必需的字段；删除、发送等高危操作会再次向你确认。</div>' +
      '</div><div class="ob-foot"><div class="ob-dots"><i></i><i class="on"></i><i></i></div><button class="btn ghost" data-act="ob.back">上一步</button><button class="btn primary" data-act="ob.next">下一步 ' + XQ.icon('arrow', 14) + '</button></div></div></div>';
    } else {
      el.innerHTML = '<div class="ob-card"><div class="ob-side"><div class="ob-logo">青</div><h2>准备好了</h2><p>你的日程、账本、科研项目和学习笔记已经就位。接下来，把重复的信息搬运交给小青。</p><div class="ob-feats"><div class="ob-feat"><span class="oi">' + XQ.icon('sparkle') + '</span>AI 已生成今日洞察</div><div class="ob-feat"><span class="oi">' + XQ.icon('sync') + '</span>已同步 3 个校内来源</div><div class="ob-feat"><span class="oi">' + XQ.icon('shield') + '</span>隐私保护已开启</div></div></div><div class="ob-main"><div class="ob-step-tag">STEP 3 · 偏好</div><h3>最后，设置你的节奏</h3><div class="ob-desc">这些设置随时可以在「设置与隐私」中修改。</div><div class="ob-body">' +
        '<div class="field" style="margin-bottom:13px"><label>本月预算</label><input class="input" id="obBudget" type="number" value="' + S().finance.monthlyBudget + '"><div class="hint">小青会根据历史开支帮你细化类目预算</div></div>' +
        '<div class="field" style="margin-bottom:13px"><label>每日提醒时间</label><select class="select"><option>21:30 · 睡前复盘</option><option>08:00 · 早间计划</option><option>12:30 · 午间提醒</option></select></div>' +
        '<div class="toggle-row"><div class="tr-main"><b>开启遗忘曲线复习提醒</b><span>根据掌握度推送薄弱知识点</span></div><div class="switch on"></div></div>' +
        '<div class="ob-note">点击「进入小青」即表示你已阅读并同意演示版的数据使用说明。</div>' +
      '</div><div class="ob-foot"><div class="ob-dots"><i></i><i></i><i class="on"></i></div><button class="btn ghost" data-act="ob.back">上一步</button><button class="btn primary" data-act="ob.enter">进入小青 ' + XQ.icon('arrow', 14) + '</button></div></div></div>';
    }
    el.querySelectorAll('[data-ob]').forEach(sw => sw.addEventListener('click', () => sw.classList.toggle('on')));
  }
  XQ.on('ob.next', () => {
    if (obStep === 0) {
      const n = document.getElementById('obName');
      if (n && n.value.trim()) S().user.name = n.value.trim();
      obStep = 1;
    } else if (obStep === 1) obStep = 2;
    renderOnboard();
  });
  XQ.on('ob.back', () => { obStep = Math.max(0, obStep - 1); renderOnboard(); });
  XQ.on('ob.skip', () => { finishOnboard(true); });
  XQ.on('ob.enter', () => {
    const b = document.getElementById('obBudget');
    if (b && Number(b.value) > 0) S().finance.monthlyBudget = Number(b.value);
    finishOnboard(false);
  });
  function finishOnboard(skip) {
    S().onboarding = true;
    XQ.store.save();
    document.getElementById('onboard').hidden = true;
    XQ.render();
    setTimeout(() => XQ.toast(skip ? '已跳过引导，直接进入小青' : '欢迎使用小青，今天也帮你把事务理顺'), 300);
  }

  /* ================= boot ================= */
  XQ.boot = function () {
    if (!location.hash) location.hash = '#/home';
    XQ.render();
    window.addEventListener('hashchange', () => { XQ.render(true); });
    document.getElementById('assistantMask').addEventListener('click', XQ.closeAssistant);
    const drawer = document.getElementById('assistantDrawer');
    drawer.innerHTML =
      '<div class="as-head"><div class="as-avatar">青</div><div style="flex:1"><b>小青 AI 助手</b><span><i></i>在线 · 可操作你的日程与账本</span></div>' +
      '<button class="icon-btn" data-act="closeAssistant">' + XQ.icon('x') + '</button></div>' +
      '<div class="as-body" id="asBody"></div>' + asQuick() +
      '<div class="as-input"><textarea id="asInput" rows="1" placeholder="说点什么，比如：明天下午三点图书馆讨论…"></textarea><button class="as-send" data-act="as.send">' + XQ.icon('send') + '</button></div>';
    const inp = document.getElementById('asInput');
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); XQ.actions['as.send'](); }
    });
    setTimeout(() => {
      const sp = document.getElementById('splash');
      sp.classList.add('hide');
      if (!S().onboarding) { obStep = 0; renderOnboard(); }
    }, 1150);
  };
})();

</script>
<script>/* schedule.js */
/* 小青 1.0 · 个人日程管理 */
(function () {
  const XQ = window.XQ;
  const S = () => XQ.store.state;
  const TODAY = () => XQ.dt.todayISO();
  const HOUR = 52, DAY_START = 8 * 60, DAY_END = 22 * 60;

  const evMins = hm => XQ.dt.mins(hm);
  const conflictSet = () => {
    const set = {};
    XQ.conflicts().forEach(c => { set[c.a.id] = true; set[c.b.id] = true; });
    return set;
  };
  const notifByEvent = n => {
    if (n.eventTitle) return S().schedule.events.find(e => e.title === n.eventTitle);
    if (n.tag === '考试') return S().schedule.events.find(e => e.category === 'exam');
    return null;
  };

  /* ---------- header ---------- */
  function head() {
    const unread = XQ.calc.unread();
    return '<div class="page-head"><div><div class="page-title">个人日程管理 <span class="tag-demo" title="课表与活动为演示数据">青海大学适配版</span></div>' +
      '<div class="page-desc">课表、活动、考试、通知统一聚合。说一句话就能建日程，新安排与已有日程冲突时主动提醒。</div></div>' +
      '<div class="page-actions">' +
      '<button class="btn" data-act="sch.export">' + XQ.icon('download') + '导出日程</button>' +
      '<button class="btn" data-act="sch.voiceTop">' + XQ.icon('mic') + '语音随录</button>' +
      '<button class="btn primary" data-act="sch.new">' + XQ.icon('plus') + '新建日程</button>' +
      '</div></div>' +
      '<div class="tabs">' +
      tab('calendar', 'calendar', '日程视图') +
      tab('notices', 'bell', '通知中心', unread) +
      tab('input', 'sparkle', '智能录入') +
      tab('sources', 'sync', '数据源绑定') +
      '</div>';
  }
  function tab(k, icon, name, count) {
    return '<button class="tab ' + (XQ.ui.tab.schedule === k ? 'active' : '') + '" data-act="sch.tab" data-tab="' + k + '">' + XQ.icon(icon, 15) + name + (count ? '<span class="count">' + count + '</span>' : '') + '</button>';
  }

  /* ---------- calendar ---------- */
  function weekDates() {
    const base = XQ.dt.weekStart(XQ.ui.calDate);
    return Array.from({ length: 7 }, (_, i) => XQ.dt.iso(XQ.dt.addDays(base, i)));
  }
  function periodLabel() {
    const v = XQ.ui.scheduleView;
    if (v === 'day') return XQ.dt.cnFull(XQ.ui.calDate);
    if (v === 'month') return XQ.dt.monthCN(XQ.dt.month(XQ.ui.calDate));
    const w = weekDates();
    return XQ.dt.cn(w[0]) + ' — ' + XQ.dt.cn(w[6]);
  }
  function shiftCal(dir) {
    const v = XQ.ui.scheduleView;
    if (v === 'day') XQ.ui.calDate = XQ.dt.iso(XQ.dt.addDays(XQ.ui.calDate, dir));
    else if (v === 'month') {
      const d = new Date(XQ.ui.calDate + 'T00:00:00');
      d.setMonth(d.getMonth() + dir);
      XQ.ui.calDate = XQ.dt.iso(d);
    } else XQ.ui.calDate = XQ.dt.iso(XQ.dt.addDays(XQ.ui.calDate, dir * 7));
    XQ.render();
  }
  function toolbar() {
    return '<div class="cal-toolbar">' +
      '<div class="cal-nav">' +
        '<button class="today-btn" data-act="sch.today">今天</button>' +
        '<button class="icon-btn" data-act="sch.prev" style="width:30px;height:30px;border:1px solid var(--line);background:#fff">' + XQ.icon('left', 15) + '</button>' +
        '<button class="icon-btn" data-act="sch.next" style="width:30px;height:30px;border:1px solid var(--line);background:#fff">' + XQ.icon('right', 15) + '</button>' +
        '<div class="cal-period">' + periodLabel() + '</div>' +
      '</div>' +
      '<div class="row"><div class="seg">' +
        ['day', 'week', 'month'].map(v => '<button class="' + (XQ.ui.scheduleView === v ? 'active' : '') + '" data-act="sch.view" data-view="' + v + '">' + ({ day: '日', week: '周', month: '月' }[v]) + '</button>').join('') +
      '</div><button class="btn sm" data-act="sch.export">' + XQ.icon('download', 14) + '导出</button></div>' +
    '</div>';
  }
  function conflictBanner() {
    const cs = XQ.conflicts();
    if (!cs.length) return '';
    return '<div class="conflict-box"><div class="ci">' + XQ.icon('alert') + '</div><div style="flex:1"><b>检测到 ' + cs.length + ' 处日程冲突</b><p>' + XQ.dt.cn(cs[0].date) + ' ' + cs[0].a.start + '—' + cs[0].a.end + '「' + XQ.esc(cs[0].a.title) + '」与「' + XQ.esc(cs[0].b.title) + '」时间重叠。小青已标记冲突日程。</p></div><button class="btn sm" data-act="sch.conflicts">处理冲突</button></div>';
  }
  function weekView() {
    const dates = weekDates();
    const events = S().schedule.events;
    const conflicts = conflictSet();
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    let headHTML = '<div class="wh-cell"></div>' + dates.map(d => {
      const isToday = d === TODAY();
      return '<div class="wh-cell ' + (isToday ? 'today' : '') + '" data-act="sch.day" data-date="' + d + '" style="cursor:pointer">' + XQ.dt.weekday(d) + '<b>' + Number(d.slice(8)) + '</b></div>';
    }).join('');
    let bodyHTML = '<div class="time-col">' + Array.from({ length: 15 }, (_, i) => '<div>' + String(8 + i).padStart(2, '0') + ':00</div>').join('') + '</div>';
    dates.forEach(d => {
      const evs = events.filter(e => e.date === d);
      const isToday = d === TODAY();
      bodyHTML += '<div class="day-col ' + (isToday ? 'today' : '') + '" data-act="sch.newAt" data-date="' + d + '" style="min-height:' + (14 * HOUR) + 'px">' +
        (isToday && nowMin >= DAY_START && nowMin <= DAY_END ? '<div style="position:absolute;left:0;right:0;top:' + ((nowMin - DAY_START) / 60 * HOUR) + 'px;height:1.5px;background:var(--rose);z-index:3;opacity:.65"><i style="position:absolute;left:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--rose)"></i></div>' : '') +
        evs.sort((a, b) => a.start.localeCompare(b.start)).map(e => {
          const s = Math.max(DAY_START, evMins(e.start)), en = Math.min(DAY_END, evMins(e.end));
          const top = (s - DAY_START) / 60 * HOUR;
          const h = Math.max(22, (en - s) / 60 * HOUR - 2);
          return '<div class="ev ' + e.source + ' ' + (e.category === 'exam' ? 'exam ' : '') + (conflicts[e.id] ? 'conflict ' : '') + '" style="top:' + top + 'px;height:' + h + 'px" data-act="sch.openEvent" data-id="' + e.id + '">' +
            '<b>' + XQ.esc(e.title) + '</b><span>' + e.start + '–' + e.end + '</span>' +
            (e.location && h > 44 ? '<span>' + XQ.esc(e.location) + '</span>' : '') +
            '</div>';
        }).join('') +
      '</div>';
    });
    return '<div class="week-wrap"><div class="week-scroll"><div class="week"><div class="week-head">' + headHTML + '</div><div class="week-body">' + bodyHTML + '</div></div></div></div>' +
      '<div class="cal-legend"><span><i style="background:#2f7ceb"></i>教务同步</span><span><i style="background:#e8912d"></i>PU 同步</span><span><i style="background:#7a5cf0"></i>通知聚合</span><span><i style="background:#0f9d76"></i>手动录入</span><span><i style="background:#e0576b"></i>考试 / 冲突</span><span class="spacer"></span><span>点击空白处可快速新建</span></div>';
  }
  function dayView() {
    const d = XQ.ui.calDate;
    const evs = S().schedule.events.filter(e => e.date === d).sort((a, b) => a.start.localeCompare(b.start));
    const conflicts = XQ.conflicts().filter(c => c.date === d);
    const list = evs.length ? evs.map(e => {
      const src = XQ.sourceMeta[e.source] || XQ.sourceMeta.manual;
      const cat = XQ.catMeta[e.category] || XQ.catMeta.personal;
      return '<div class="day-event" data-act="sch.openEvent" data-id="' + e.id + '" style="cursor:pointer">' +
        '<div class="de-time">' + e.start + '<span>' + e.end + '</span></div>' +
        '<i class="ti-bar" style="--tc:' + src.color + '"></i>' +
        '<div class="de-main"><div class="de-title">' + XQ.esc(e.title) + ' <span class="badge ' + (e.category === 'exam' ? 'rose' : e.category === 'meeting' ? 'purple' : 'gray') + '">' + cat.label + '</span>' + (e.priority === 'high' ? '<span class="badge amber">重要</span>' : '') + '</div>' +
        '<div class="de-meta">' + (e.location ? '<span>' + XQ.icon('pin', 12) + XQ.esc(e.location) + '</span>' : '') + '<span>' + XQ.icon('sync', 12) + src.label + '</span>' + (e.teacher ? '<span>' + XQ.icon('user', 12) + XQ.esc(e.teacher) + '</span>' : '') + '</div>' +
        (e.note ? '<div class="tiny muted" style="margin-top:4px">' + XQ.esc(e.note) + '</div>' : '') + '</div>' +
        '<span class="badge ' + (e.priority === 'high' ? 'rose' : 'gray') + '" style="flex-shrink:0">' + (e.priority === 'high' ? '高优先级' : e.priority === 'low' ? '低' : '普通') + '</span>' +
        '</div>';
    }).join('') : '<div class="empty"><div class="eico">' + XQ.icon('calendar', 22) + '</div><b>这一天还没有日程</b><span class="small">点击「新建日程」，或让我帮你记下来</span><div style="margin-top:12px"><button class="btn sm primary" data-act="sch.new" data-date="' + d + '">新建日程</button></div></div>';
    const srcCounts = {};
    evs.forEach(e => { srcCounts[e.source] = (srcCounts[e.source] || 0) + 1; });
    return '<div class="grid-2" style="grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start">' +
      '<div class="card card-pad"><div class="card-head"><div><div class="card-title">' + XQ.dt.cnFull(d) + '</div><div class="card-sub">共 ' + evs.length + ' 项安排 · ' + (conflicts.length ? conflicts.length + ' 处冲突' : '时间无冲突') + '</div></div><button class="btn sm" data-act="sch.new" data-date="' + d + '">' + XQ.icon('plus', 14) + '新建</button></div>' +
        '<div class="day-list">' + list + '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:14px">' +
        (conflicts.length ? '<div class="card card-pad" style="border-color:#f4d5da"><div class="card-title" style="color:#b5374b">' + XQ.icon('alert', 16) + '冲突提醒</div>' +
          conflicts.map(c => '<div style="padding:10px 0;border-bottom:1px solid var(--line-2)"><div class="small"><b>' + c.a.start + '–' + c.a.end + '</b> ' + XQ.esc(c.a.title) + '</div><div class="small" style="margin-top:2px"><b>' + c.b.start + '–' + c.b.end + '</b> ' + XQ.esc(c.b.title) + '</div></div>').join('') +
          '<button class="btn sm soft" style="margin-top:10px;width:100%" data-act="sch.conflicts">去处理</button></div>' : '') +
        '<div class="card card-pad"><div class="card-title" style="margin-bottom:10px">' + XQ.icon('layers', 16) + '当天来源</div>' +
          (Object.keys(srcCounts).length ? Object.keys(srcCounts).map(k => { const m = XQ.sourceMeta[k] || XQ.sourceMeta.manual; return '<div class="row" style="padding:6px 0"><i style="width:7px;height:7px;border-radius:2px;background:' + m.color + '"></i><span class="small">' + m.label + '</span><span class="spacer"></span><b class="small">' + srcCounts[k] + '</b></div>'; }).join('') : '<div class="small muted">暂无</div>') +
          '<div class="divider"></div><div class="demo-note">' + XQ.icon('info') + '<div>日程来源会自动标注，导出 PDF 时同样保留，便于打印张贴或提交。</div></div></div>' +
        '<div class="card card-pad"><div class="card-title" style="margin-bottom:8px">' + XQ.icon('clock', 16) + '智能提醒</div><div class="small muted" style="line-height:1.8">' + (evs.length ? '· 首项安排前 ' + evs[0].reminder + ' 分钟提醒<br>· 冲突项已标红<br>· 考试类日程提前 1 天提醒' : '当天暂无提醒') + '</div></div>' +
      '</div></div>';
  }
  function monthView() {
    const d = new Date(XQ.ui.calDate + 'T00:00:00');
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const start = XQ.dt.weekStart(first);
    const cells = Array.from({ length: 42 }, (_, i) => XQ.dt.iso(XQ.dt.addDays(start, i)));
    const conflicts = conflictSet();
    let html = '<div class="month-head">' + ['周一', '周二', '周三', '周四', '周五', '周六', '周日'].map(x => '<div>' + x + '</div>').join('') + '</div><div class="month">';
    cells.forEach(iso => {
      const evs = S().schedule.events.filter(e => e.date === iso).sort((a, b) => a.start.localeCompare(b.start));
      const dim = new Date(iso + 'T00:00:00').getMonth() !== d.getMonth();
      html += '<div class="mcell ' + (dim ? 'dim ' : '') + (iso === TODAY() ? 'today ' : '') + '" data-act="sch.day" data-date="' + iso + '">' +
        '<div class="mday">' + Number(iso.slice(8)) + '</div><div class="mevents">' +
        evs.slice(0, 2).map(e => {
          const src = XQ.sourceMeta[e.source] || XQ.sourceMeta.manual;
          return '<div class="mevent" style="--eb:' + src.bg + ';--et:' + src.color + ';--ec:' + src.color + ';' + (conflicts[e.id] ? 'outline:1px dashed #e0576b;' : '') + '" data-act="sch.openEvent" data-id="' + e.id + '">' + e.start + ' ' + XQ.esc(e.title) + '</div>';
        }).join('') +
        (evs.length > 2 ? '<div class="mmore">+' + (evs.length - 2) + ' 项</div>' : '') +
        '</div></div>';
    });

      XQ.toast('语音已识别：「明天下午三点在图书馆研讨间 3 讨论小组作业」');
    }, 1800);
  });
  XQ.on('sch.voiceTop', () => { XQ.ui.tab.schedule = 'input'; XQ.render(); setTimeout(() => { const b = document.getElementById('quickVoice'); if (b) b.click(); }, 200); });
  XQ.on('sch.clearParse', () => { XQ.ui.parsed = null; XQ.render(); });
  XQ.on('sch.confirmParse', () => {
    const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    const data = {
      title: g('parseTitle') || '新日程', date: g('parseDate'), start: g('parseStart'), end: g('parseEnd'),
      location: g('parseLoc'), source: 'manual', category: 'personal', reminder: 15, note: '由自然语言解析创建', priority: 'normal'
    };
    if (data.end <= data.start) { XQ.toast('结束时间需要晚于开始时间', 'err'); return; }
    const conf = XQ.conflictsFor(data.date, data.start, data.end);
    if (conf.length) {
      XQ.confirm({ title: '时间冲突', body: '该时间与「' + XQ.esc(conf[0].title) + '」重叠（' + conf[0].start + '–' + conf[0].end + '），仍要添加吗？', okText: '仍然添加', onOk: () => {
        XQ.addEvent(data); XQ.ui.parsed = null; XQ.ui.quickText = ''; XQ.render(); XQ.toast('已添加，冲突已在日程中标记');
      } });
    } else {
      XQ.addEvent(data); XQ.ui.parsed = null; XQ.ui.quickText = ''; XQ.render(); XQ.toast('日程已添加');
    }
  });

  /* ---------- sources ---------- */
  function sourcesPage() {
    const b = S().schedule.bindings;
    const items = [
      { k: 'cas', logo: 'CAS', name: '统一身份认证', desc: '一站式服务大厅 · 校外需 VPN', on: b.cas, sync: '一次绑定，全站通用' },
      { k: 'jw', logo: '教务', name: '教务系统', desc: '课表、考试安排、调课通知', on: b.jw, sync: '上次同步 ' + S().schedule.lastSync },
      { k: 'pu', logo: 'PU', name: 'PU 口袋校园', desc: '第二课堂活动、报名与学分', on: b.pu, sync: '上次同步 ' + S().schedule.lastSync },
      { k: 'portal', logo: '青大', name: '掌上青大', desc: '通知公告、学工与教务资讯', on: b.portal, sync: '上次同步 ' + S().schedule.lastSync },
      { k: 'yiban', logo: '易班', name: '易班平台', desc: '校园活动与班级通知', on: b.yiban, sync: '上次同步 ' + S().schedule.lastSync },
      { k: 'library', logo: '图书', name: '图书馆系统', desc: '借阅、座位预约与讲座', on: b.library, sync: '尚未绑定' }
    ];
    return '<div class="grid-2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start">' +
      '<div class="card card-pad"><div class="card-head"><div><div class="card-title">' + XQ.icon('link', 16) + '校内数据源</div><div class="card-sub">一次授权绑定，之后自动同步</div></div><button class="btn sm primary" data-act="sch.syncAll">' + XQ.icon('sync', 14) + '立即同步</button></div>' +
        items.map(it =>
          '<div class="source-card"><div class="source-logo">' + it.logo + '</div><div class="source-main"><b>' + it.name + (it.k === 'cas' ? '<span class="badge green">已认证</span>' : '') + '</b><span>' + it.desc + ' · ' + it.sync + '</span></div>' +
          (it.k === 'cas' ? '<span class="badge green">已绑定</span>' : '<div class="switch ' + (it.on ? 'on' : '') + '" data-act="sch.toggleSource" data-k="' + it.k + '"></div>') + '</div>'
        ).join('') +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:14px">' +
        '<div class="card card-pad"><div class="card-title" style="margin-bottom:12px">' + XQ.icon('sync', 16) + '同步链路</div>' +
          '<div class="steps"><div class="step done"><div class="sd"></div><span>授权绑定</span></div><div class="step done"><div class="sd"></div><span>自动拉取</span></div><div class="step done"><div class="sd"></div><span>解析生成</span></div><div class="step on"><div class="sd"></div><span>变更提醒</span></div></div>' +
          '<div class="small muted" style="line-height:1.8;margin-top:10px">课表变化、考试安排、调课通知会即时写入日程；PU 活动开始前按你的偏好提醒。</div>' +
          '<div class="divider"></div><div class="kv"><span>最近同步</span><b>' + S().schedule.lastSync + '</b></div><div class="kv"><span>已同步日程</span><b>' + S().schedule.events.length + ' 条</b></div><div class="kv"><span>已聚合通知</span><b>' + S().schedule.notifications.length + ' 条</b></div></div>' +
        '<div class="card card-pad"><div class="card-title" style="margin-bottom:8px">' + XQ.icon('shield', 16) + '权限说明</div><div class="small muted" style="line-height:1.8">小青只读取生成日程所必需的字段；不会读取成绩、个人身份信息等无关数据。可随时关闭单个数据源。</div>' +
          '<div class="demo-note" style="margin-top:10px">' + XQ.icon('info') + '<div>原型中的同步为模拟：不会真正连接学校系统。正式版通过 CAS 统一认证与校方接口对接。</div></div></div>' +
      '</div></div>';
  }
  XQ.on('sch.toggleSource', el => {
    const k = el.dataset.k;
    S().schedule.bindings[k] = !S().schedule.bindings[k];
    el.classList.toggle('on');
    XQ.store.save();
    XQ.toast(S().schedule.bindings[k] ? '已绑定，正在拉取数据…' : '已关闭该数据源', S().schedule.bindings[k] ? 'ok' : 'warn');
  });
  XQ.on('sch.syncAll', el => {
    const btn = el;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin" style="display:inline-flex">' + XQ.icon('sync', 14) + '</span>同步中…';
    setTimeout(() => {
      S().schedule.lastSync = XQ.dt.nowISO();
      if (!S().schedule.syncedOnce) {
        S().schedule.syncedOnce = true;
        S().schedule.notifications.unshift({
          id: XQ.uid('n'), source: '图书馆', srcShort: '图书', color: '#71827d',
          title: '图书馆座位预约系统升级完成', desc: '即日起可通过图书馆公众号预约四楼自习座位，每日 07:00 开放次日预约。', time: XQ.dt.nowISO(),
          level: 'normal', read: false, tag: '服务'
        });
      }
      XQ.store.save(); XQ.render(); XQ.toast('同步完成：课表、PU 活动、通知均为最新');
    }, 1200);
  });

  /* ---------- export ---------- */
  XQ.on('sch.export', () => {
    XQ.modal({
      title: '导出日程', sub: '导出文件会保留来源标签',
      body: '<div class="form-grid"><div class="field"><label>范围</label><select class="select" id="expRange"><option value="day">今天</option><option value="week" selected>本周</option><option value="month">本月</option><option value="all">全部日程</option></select></div>' +
        '<div class="field"><label>格式</label><select class="select" id="expFormat"><option value="pdf">PDF（打印）</option><option value="word">Word 文档</option><option value="excel">Excel / CSV</option></select></div></div>' +
        '<div class="divider"></div><div class="small muted" style="line-height:1.8">导出内容包含：日期、时间、事项、地点、来源标签、备注。可用于打印张贴、提交给老师或团队共享。</div>' +
        '<div class="demo-note" style="margin-top:10px">' + XQ.icon('info') + '<div>PDF 通过浏览器打印生成，可在打印对话框中选择「另存为 PDF」。</div></div>',
      footer: '<button class="btn" data-close>取消</button><button class="btn primary" data-act="sch.doExport">导出</button>'
    });
  });
  XQ.on('sch.doExport', () => {
    const range = (document.getElementById('expRange') || {}).value || 'week';
    const fmt = (document.getElementById('expFormat') || {}).value || 'pdf';
    const today = TODAY();
    let list = S().schedule.events.slice();
    if (range === 'day') list = list.filter(e => e.date === today);
    else if (range === 'week') { const a = XQ.dt.iso(XQ.dt.weekStart()), b = XQ.dt.iso(XQ.dt.addDays(XQ.dt.weekStart(), 6)); list = list.filter(e => e.date >= a && e.date <= b); }
    else if (range === 'month') { const m = XQ.dt.month(today); list = list.filter(e => e.date.slice(0, 7) === m); }
    list.sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
    if (!list.length) { XQ.toast('所选范围内没有日程', 'warn'); return; }
    const rows = list.map(e => [XQ.dt.cnFull(e.date), e.start + '–' + e.end, e.title, e.location || '—', (XQ.sourceMeta[e.source] || XQ.sourceMeta.manual).label, e.note || '']);
    if (fmt === 'excel') {
      XQ.exportCSV('小青日程表', [['日期', '时间', '事项', '地点', '来源', '备注']].concat(rows));
    } else {
      const html = '<p style="text-indent:0;color:#666">导出范围：' + ({ day: '今天', week: '本周', month: '本月', all: '全部' }[range]) + ' · 共 ' + list.length + ' 项 · 导出时间 ' + XQ.dt.nowISO() + '</p>' +
        '<table><thead><tr><th>日期</th><th>时间</th><th>事项</th><th>地点</th><th>来源</th><th>备注</th></tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map((c, i) => '<td>' + (i === 4 ? '<span class="tag">' + XQ.esc(c) + '</span>' : XQ.esc(c)) + '</td>').join('') + '</tr>').join('') + '</tbody></table>' +
        '<p style="text-indent:0;color:#999;font-size:9.5px;margin-top:14px">来源说明：教务同步＝教务系统自动拉取；PU 同步＝第二课堂活动；通知聚合＝校内通知识别生成；手动录入＝用户自己添加。</p>';
      if (fmt === 'word') XQ.exportWord('小青 · 个人日程表', html);
      else XQ.printDoc('小青 · 个人日程表', html);
    }
    XQ.closeModal();
    setTimeout(() => XQ.toast('日程已导出'), 300);
  });

  /* ---------- view ---------- */
  XQ.views.schedule = function () {
    const tab = XQ.ui.tab.schedule;
    let body = '';
    if (tab === 'calendar') body = calendarPage();
    else if (tab === 'notices') body = noticesPage();
    else if (tab === 'input') body = inputPage();
    else body = sourcesPage();
    return head() + body;
  };
})();

</script>
<script>/* finance.js */
/* 小青 1.0 · 个人财务管理 */
(function () {
  const XQ = window.XQ;
  const S = () => XQ.store.state;
  const F = () => S().finance;
  const THIS_MONTH = XQ.dt.month(new Date());
  const curMonth = () => XQ.ui.financeMonth || THIS_MONTH;
  const monthTx = m => S().finance.transactions.filter(t => (t.date || '').slice(0, 7) === m)
    .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
  const spentOf = m => monthTx(m).filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
  const incomeOf = m => monthTx(m).filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
  const catSpentOf = m => {
    const map = {};
    monthTx(m).filter(t => t.type === 'expense').forEach(t => { map[t.category] = (map[t.category] || 0) + Number(t.amount); });
    return map;
  };
  const monthLabel = m => XQ.dt.monthCN(m);
  const pct = (a, b) => b > 0 ? a / b * 100 : 0;

  /* ---------- page ---------- */
  function head() {
    const m = curMonth();
    return '<div class="page-head"><div><div class="page-title">个人财务管理</div>' +
      '<div class="page-desc">电子账单、纸质票据、语音、手动四种记账方式；月度与学期预算、周期决算，以及预算 / 开支 / 决算三级预警。</div></div>' +
      '<div class="page-actions">' +
        '<div class="cal-nav" style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px 4px"><button class="icon-btn" style="width:28px;height:28px" data-act="fin.prevMonth">' + XQ.icon('left', 14) + '</button><span style="font-size:12.5px;font-weight:600;min-width:86px;text-align:center">' + monthLabel(m) + '</span><button class="icon-btn" style="width:28px;height:28px" data-act="fin.nextMonth">' + XQ.icon('right', 14) + '</button></div>' +
        '<button class="btn" data-act="fin.import">' + XQ.icon('upload') + '导入账单</button>' +
        '<button class="btn primary" data-act="fin.add">' + XQ.icon('plus') + '记一笔</button>' +
      '</div></div>' +
      '<div class="tabs">' +
        tab('overview', 'chart', '概览') + tab('detail', 'list', '收支明细') + tab('budget', 'target', '预算') + tab('report', 'file', '决算报告') + tab('warnings', 'alert', '三级预警') +
      '</div>';
  }
  function tab(k, icon, name) {
    return '<button class="tab ' + (XQ.ui.tab.finance === k ? 'active' : '') + '" data-act="fin.tab" data-tab="' + k + '">' + XQ.icon(icon, 15) + name + '</button>';
  }

  /* ---------- overview ---------- */
  function overview() {
    const m = curMonth();
    const tx = monthTx(m);
    const spent = spentOf(m);
    const income = incomeOf(m);
    const budget = F().monthlyBudget;
    const reserved = XQ.calc.reserved();
    const available = budget - spent - reserved;
    const cats = catSpentOf(m);
    const catItems = Object.keys(cats).map(k => ({ label: k, value: cats[k], color: (XQ.finCats[k] || XQ.finCats['其他']).color })).sort((a, b) => b.value - a.value);
    const p = pct(spent, budget);
    const daysInMonth = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0).getDate();
    const elapsed = m === THIS_MONTH ? new Date().getDate() : daysInMonth;
    const daily = spent / Math.max(1, elapsed);
    const chartItems = F().history.concat([{ month: m, spent: spent }]).map(h => ({ label: Number(h.month.slice(5)) + '月', value: h.spent }));
    const recent = tx.slice(0, 5);
    const topAlerts = buildAlerts().slice(0, 2);

    return '<div class="fin-hero">' +
      '<div class="balance-card">' +
        '<div class="bc-label">本月可用金额 · 预算 − 已支出 − 预留</div>' +
        '<div class="bc-value"><small>¥</small>' + XQ.money(Math.max(0, available), { dec: 2 }) + '</div>' +
        '<div class="bc-meta"><div><span>本月预算</span><b>¥' + XQ.money(budget, { dec: 0 }) + '</b></div><div><span>已支出</span><b>¥' + XQ.money(spent, { dec: 0 }) + '</b></div><div><span>已预留</span><b>¥' + XQ.money(reserved, { dec: 0 }) + '</b></div></div>' +
        '<div class="bc-bar"><div class="b-top"><span>预算执行 ' + p.toFixed(0) + '%</span><span>' + (available >= 0 ? '还剩 ' + (daysInMonth - elapsed) + ' 天' : '已超出预算') + '</span></div><div class="progress ' + (p >= 100 ? 'bad' : p >= 80 ? 'warn' : '') + '"><i style="width:' + Math.min(100, p) + '%"></i></div></div>' +
        '<div class="bc-chips"><span class="bc-chip"><i></i>日均 ¥' + XQ.money(daily, { dec: 0 }) + '</span><span class="bc-chip"><i></i>' + (cats['餐饮'] ? '餐饮占比 ' + Math.round(pct(cats['餐饮'], spent)) + '%' : '暂无餐饮支出') + '</span><span class="bc-chip"><i></i>挑战杯预留 ¥300</span></div>' +
      '</div>' +
      '<div class="card card-pad"><div class="card-head" style="margin-bottom:6px"><div><div class="card-title">' + XQ.icon('chart', 16) + '本月支出结构</div><div class="card-sub">共 ' + tx.filter(t => t.type === 'expense').length + ' 笔支出</div></div><button class="link" data-act="fin.tab" data-tab="detail">明细 ' + XQ.icon('arrow', 13) + '</button></div>' +
        '<div class="donut-wrap" style="margin-top:14px">' +
          '<div style="position:relative;width:132px;height:132px;flex:0 0 132px">' + XQ.chart.donut(catItems, 132, 15) +
            '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="tiny muted">总支出</span><b style="font-size:17px;font-weight:700;letter-spacing:-.5px">¥' + XQ.money(spent, { dec: 0 }) + '</b></div></div>' +
          '<div class="donut-legend">' + catItems.slice(0, 5).map(c => '<div class="legend-row"><i class="ld" style="background:' + c.color + '"></i>' + c.label + '<span class="lv">¥' + XQ.money(c.value, { dec: 0 }) + '</span></div>').join('') + '</div>' +
        '</div>' +
        '<div class="divider" style="margin:14px 0"></div>' +
        '<div class="quick-entry">' +
          '<button class="qe" data-act="fin.add">' + '<span class="qe-ico">' + XQ.icon('edit', 16) + '</span>手动记账</button>' +
          '<button class="qe" data-act="fin.voice">' + '<span class="qe-ico">' + XQ.icon('mic', 16) + '</span>语音记账</button>' +
          '<button class="qe" data-act="fin.receipt">' + '<span class="qe-ico">' + XQ.icon('camera', 16) + '</span>拍票据</button>' +
          '<button class="qe" data-act="fin.import">' + '<span class="qe-ico">' + XQ.icon('upload', 16) + '</span>导入账单</button>' +
        '</div>' +
      '</div></div>' +

      '<div class="stat-grid" style="margin-top:14px">' +
        stat('本月支出', '¥' + XQ.money(spent, { dec: 0 }), '共 ' + tx.filter(t => t.type === 'expense').length + ' 笔', 'wallet') +
        stat('本月收入', '¥' + XQ.money(income, { dec: 0 }), income ? '生活费已到账' : '暂无收入记录', 'coin') +
        stat('预算剩余', '¥' + XQ.money(Math.max(0, budget - spent), { dec: 0 }), '执行率 ' + p.toFixed(0) + '%', 'target') +
        stat('单笔最高', '¥' + XQ.money(Math.max.apply(null, tx.filter(t => t.type === 'expense').map(t => t.amount).concat([0])), { dec: 0 }), '双十一 · 冲锋衣', 'chart') +
      '</div>' +

      '<div class="home-grid" style="margin-top:16px">' +
        '<div class="card card-pad"><div class="card-head"><div><div class="card-title">' + XQ.icon('chart', 16) + '近 6 个月支出趋势</div><div class="card-sub">10 月支出偏高，11 月已回落</div></div><span class="badge amber">10 月超支 26%</span></div>' +
          XQ.chart.line(chartItems, { h: 168, color: '#0f9d76', id: 'fin' }) +
          '<div class="row small muted" style="margin-top:6px"><span>月均 ¥1,517</span><span class="spacer"></span><span>预算线 ¥1,500</span></div></div>' +
        '<div class="card card-pad"><div class="card-head"><div><div class="card-title">' + XQ.icon('list', 16) + '最近记录</div><div class="card-sub">语音 / OCR / 导入 / 手动</div></div><button class="link" data-act="fin.tab" data-tab="detail">全部 ' + XQ.icon('arrow', 13) + '</button></div>' +
          (recent.length ? recent.map(t => txnRow(t)).join('') : '<div class="empty">本月还没有记录</div>') + '</div>' +
      '</div>' +

      '<div class="home-grid" style="margin-top:16px">' +
        '<div class="card card-pad"><div class="card-head"><div><div class="card-title">' + XQ.icon('gift', 16) + '专项预留</div><div class="card-sub">与日程、科研项目联动，避免临时缺钱</div></div><button class="btn sm" data-act="fin.addReserve">' + XQ.icon('plus', 14) + '新增</button></div>' +
          (F().reserves.length ? F().reserves.map(r =>
            '<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line-2)"><div style="flex:1;min-width:0"><div class="small" style="font-weight:600">' + XQ.esc(r.name) + '</div><div class="tiny muted" style="margin-top:1px">' + XQ.esc(r.project) + ' · ' + XQ.dt.cn(r.due) + ' 前</div></div><b class="num" style="font-size:13px">¥' + XQ.money(r.amount, { dec: 0 }) + '</b><button class="icon-btn" style="width:26px;height:26px" data-act="fin.delReserve" data-id="' + r.id + '">' + XQ.icon('trash', 13) + '</button></div>'
          ).join('') : '<div class="empty">暂无预留</div>') +
          '<div class="demo-note" style="margin-top:10px">' + XQ.icon('info') + '<div>预留金额会从本月可用预算中扣除，但仍计入预算池。报名竞赛、购买材料前可先预留。</div></div></div>' +
        '<div class="card card-pad"><div class="card-head"><div><div class="card-title">' + XQ.icon('alert', 16) + '预警提醒</div><div class="card-sub">规则引擎 + AI 解释</div></div><button class="link" data-act="fin.tab" data-tab="warnings">全部 ' + XQ.icon('arrow', 13) + '</button></div>' +
          (topAlerts.length ? topAlerts.map(a => alertCard(a)).join('') : '<div class="empty">暂无预警，继续保持</div>') + '</div>' +
      '</div>';
  }
  function stat(label, value, hint, icon) {
    return '<div class="stat"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div><div class="stat-hint">' + hint + '</div><div class="stat-ico">' + XQ.icon(icon, 16) + '</div></div>';
  }
  function txnRow(t) {
    const cat = XQ.finCats[t.category] || XQ.finCats['其他'];
    const isIncome = t.type === 'income';
    return '<div class="txn" data-act="fin.editTx" data-id="' + t.id + '" style="cursor:pointer">' +

      '<div class="txn-amt ' + (isIncome ? 'income' : '') + '">' + (isIncome ? '+' : '−') + '¥' + XQ.money(t.amount) + '</div></div>';

  /* ---------- detail ---------- */
  function filteredTx() {
    const q = (XQ.ui.finQ || '').trim();
    const cat = XQ.ui.finCat || 'all';
    const type = XQ.ui.finType || 'all';
    return monthTx(curMonth()).filter(t => {
      if (type !== 'all' && t.type !== type) return false;
      if (cat !== 'all' && t.category !== cat) return false;
      if (q && !(t.note + t.category + t.method).includes(q)) return false;
      return true;
    });
  }
  function txListHTML() {
    const list = filteredTx();
    if (!list.length) return '<div class="empty"><div class="eico">' + XQ.icon('wallet', 22) + '</div><b>没有符合条件的记录</b><span class="small">换一个筛选条件，或记一笔</span></div>';
    const groups = {};
    list.forEach(t => { (groups[t.date] = groups[t.date] || []).push(t); });
    return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
      const items = groups[date];
      const total = items.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
      return '<div class="txn-day"><span>' + XQ.dt.cnFull(date) + '</span><span>支出 ¥' + XQ.money(total) + '</span></div>' + items.map(txnRow).join('');
    }).join('');
  }
  function detail() {
    const m = curMonth();
    const cats = Object.keys(F().categoryBudgets);
    const list = filteredTx();
    const totalExpense = list.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
    return '<div class="card card-pad">' +
      '<div class="row wrap" style="gap:9px;margin-bottom:13px">' +
        '<div class="field" style="width:210px"><input class="input" placeholder="' + XQ.icon('search', 0) + '搜索备注、类目…" value="' + XQ.esc(XQ.ui.finQ || '') + '" data-input="fin.search"></div>' +
        '<div class="seg">' + ['all', 'expense', 'income'].map(v => '<button class="' + ((XQ.ui.finType || 'all') === v ? 'active' : '') + '" data-act="fin.type" data-v="' + v + '">' + ({ all: '全部', expense: '支出', income: '收入' }[v]) + '</button>').join('') + '</div>' +
        '<select class="select" style="width:120px;height:36px" data-change="fin.cat"><option value="all">全部类目</option>' + cats.map(c => '<option value="' + c + '" ' + (XQ.ui.finCat === c ? 'selected' : '') + '>' + c + '</option>').join('') + '</select>' +
        '<span class="spacer"></span><span class="small muted">' + list.length + ' 笔 · 支出 ¥' + XQ.money(totalExpense) + '</span>' +
        '<button class="btn sm" data-act="fin.exportDetail">' + XQ.icon('download', 14) + '导出明细</button>' +
      '</div>' +
      '<div id="txList">' + txListHTML() + '</div>' +
      '<div class="divider"></div><div class="row"><span class="small muted">'+monthLabel(m)+' · 所有记录保存在本机</span><span class="spacer"></span><button class="btn sm primary" data-act="fin.add">'+XQ.icon('plus',14)+'记一笔</button></div>' +
    '</div>';
  }
  XQ.on('fin.tab', el => { XQ.ui.tab.finance = el.dataset.tab; XQ.render(); });
  XQ.on('fin.search', el => {
    XQ.ui.finQ = el.value;
    const box = document.getElementById('txList');
    if (box) box.innerHTML = txListHTML();
  });
  XQ.on('fin.type', el => { XQ.ui.finType = el.dataset.v; XQ.render(); });
  XQ.on('fin.cat', el => { XQ.ui.finCat = el.value; XQ.render(); });
  XQ.on('fin.prevMonth', () => {
    const d = new Date(curMonth() + '-01T00:00:00');
    d.setMonth(d.getMonth() - 1);
    XQ.ui.financeMonth = XQ.dt.month(d);
    XQ.render();
  });
  XQ.on('fin.nextMonth', () => {
    const d = new Date(curMonth() + '-01T00:00:00');
    d.setMonth(d.getMonth() + 1);
    if (XQ.dt.month(d) > THIS_MONTH) return;
    XQ.ui.financeMonth = XQ.dt.month(d);
    XQ.render();
  });

  /* ---------- add / edit tx ---------- */
  function txForm(pre, id) {
    const t = pre || {};

    XQ.modal({

        '</div>' +
        '<div class="demo-note" style="margin-top:12px">' + XQ.icon('link') + '<div>关联科研项目后，这笔支出会同步计入该项目的经费执行统计。</div></div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' + (id ? '<button type="button" class="btn danger" data-act="fin.delTx" data-id="' + id + '">删除</button>' : '') + '<button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary">保存</button></div>' +
      '</form>',
      footer: false
    });
  }
  XQ.on('fin.add', () => txForm());
  XQ.on('fin.editTx', el => {
    const t = S().finance.transactions.find(x => x.id === el.dataset.id);
    if (t) txForm(t, t.id);
  });
  XQ.on('fin.saveTx', form => {
    const fd = new FormData(form);
    const data = {
      type: fd.get('type'), amount: Number(fd.get('amount')), category: fd.get('category'),
      date: fd.get('date'), note: (fd.get('note') || '').trim() || fd.get('category'),
      method: fd.get('method') || '手动', link: fd.get('link') || '', time: XQ.timeHM()
    };
    if (!data.amount || data.amount <= 0) { XQ.toast('请输入有效金额', 'err'); return; }
    const id = fd.get('id');
    if (id) {
      const t = S().finance.transactions.find(x => x.id === id);
      if (t) Object.assign(t, data);
    } else {
      XQ.addTx(data);
    }
    XQ.store.save();
    XQ.closeModal();
    XQ.render();
    XQ.toast(id ? '记录已更新' : '已记账：¥' + XQ.money(data.amount));
  });
  XQ.on('fin.delTx', el => {
    const id = el.dataset.id;
    XQ.confirm({ title: '删除记录', body: '确定删除这笔记录吗？', okText: '删除', danger: true, onOk: () => {
      const i = S().finance.transactions.findIndex(t => t.id === id);
      if (i >= 0) S().finance.transactions.splice(i, 1);
      XQ.store.save(); XQ.closeModal(); XQ.render(); XQ.toast('记录已删除');
    } });
  });

  XQ.financeUI = {
    receipt: () => openReceipt(),
    voice: () => openVoice(),
    add: () => txForm()
  };

        '<div style="margin-top:14px;font-size:12.5px;color:var(--muted)" id="voiceHint">点击麦克风开始说话</div>' +

  /* ---------- import ---------- */
  XQ.on('fin.import', () => {
    const sample = XQ.D(-1) + ',12.5,餐饮,食堂午饭\n' + XQ.D(-1) + ',2,交通,公交\n' + XQ.D(-2) + ',36,学习,打印资料';
    XQ.modal({
      title: '导入电子账单', sub: '支持支付宝 / 微信 / 银行账单 CSV 文本',
      body: '<div class="field"><label>粘贴账单内容（每行：日期,金额,类目,备注）</label><textarea class="textarea" id="importText" rows="7" style="font-family:var(--mono);font-size:11.5px">' + sample + '</textarea><div class="hint">也支持选择 CSV 文件导入，系统会自动识别常见账单格式。</div></div>' +
        '<div class="row" style="margin-top:9px"><button class="btn sm" id="pickCsv">' + XQ.icon('upload', 14) + '选择 CSV 文件</button><input type="file" id="csvFile" accept=".csv,text/csv" style="display:none"><span class="tiny muted">演示：当前解析示例文本</span></div>' +
        '<div class="demo-note" style="margin-top:12px">' + XQ.icon('info') + '<div>正式版可直连支付宝 / 微信账单导出文件，自动去重并匹配类目。</div></div>',
      footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="doImport">开始导入</button>',
      onMount: (mask) => {
        const text = mask.querySelector('#importText');
        mask.querySelector('#pickCsv').addEventListener('click', () => mask.querySelector('#csvFile').click());
        mask.querySelector('#csvFile').addEventListener('change', e => {
          const f = e.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = () => { text.value = String(r.result || '').trim(); };
          r.readAsText(f);
        });
        mask.querySelector('#doImport').addEventListener('click', () => {
          const lines = text.value.split(/\n+/).map(s => s.trim()).filter(Boolean);
          let n = 0, sum = 0;
          lines.forEach(line => {
            const parts = line.split(/[,，\t]/).map(s => s.trim());
            if (parts.length < 2) return;
            const amount = Number(parts[1]);
            if (!amount) return;
            XQ.addTx({ date: /^\d{4}-\d{2}-\d{2}$/.test(parts[0]) ? parts[0] : XQ.dt.todayISO(), amount, category: parts[2] || '其他', note: parts[3] || '账单导入', method: '导入' });
            n++; sum += amount;
          });
          XQ.store.save(); XQ.closeModal(); XQ.render();
          XQ.toast('已导入 ' + n + ' 笔记录，合计 ¥' + XQ.money(sum));
        });
      }
    });
  });

        '<div class="card card-pad"><div class="card-title" style="margin-bottom:10px">' + XQ.icon('calendar', 16) + '学期预算</div>' +
          '<div class="row" style="align-items:flex-end;gap:8px"><div style="font-size:26px;font-weight:700;letter-spacing:-.6px">¥' + XQ.money(semesterSpent, { dec: 0 }) + '</div><div class="small muted" style="padding-bottom:3px">/ ¥' + XQ.money(semesterBudget, { dec: 0 }) + '</div><span class="spacer"></span><span class="badge ' + (semP >= 90 ? 'amber' : 'green') + '">' + semP.toFixed(0) + '%</span></div>' +

  XQ.on('fin.editTotal', () => {

  XQ.on('fin.aiBudget', () => {
    const hist = F().history.slice(-3);
    const sums = {};
    hist.forEach(h => Object.keys(h.categories).forEach(k => { sums[k] = (sums[k] || 0) + h.categories[k]; }));
    const total = Object.values(sums).reduce((a, b) => a + b, 0) || 1;
    const budget = F().monthlyBudget;
    let rows = [];
    Object.keys(sums).sort((a, b) => sums[b] - sums[a]).forEach(k => {
      const avg = sums[k] / hist.length;
      const sug = Math.max(20, Math.round(budget * (sums[k] / total) / 10) * 10);
      rows.push({ k, avg, sug });
    });

      title: 'AI 预算建议', sub: '参考近 3 个月实际开支 · 总额保持不变',
      body: '<div class="table-wrap"><table class="table"><thead><tr><th>类目</th><th class="n">月均支出</th><th class="n">建议预算</th></tr></thead><tbody>' +

  /* ---------- report ---------- */
  function monthStats(m) {
    const hist = F().history.find(h => h.month === m);
    if (hist && m !== THIS_MONTH) return { budget: hist.budget, spent: hist.spent, categories: hist.categories, isHist: true };
    return { budget: F().monthlyBudget, spent: spentOf(m), categories: catSpentOf(m), isHist: false };
  }
  function report() {
    const m = XQ.ui.reportMonth || curMonth();
    const st = monthStats(m);
    const diff = st.budget - st.spent;
    const p = pct(st.spent, st.budget);
    const cats = Object.keys(Object.assign({}, F().categoryBudgets, st.categories));
    const rows = cats.map(c => {
      const actual = st.categories[c] || 0;
      const bud = st.isHist ? Math.round(st.budget * (F().categoryBudgets[c] || 0) / F().monthlyBudget) : (F().categoryBudgets[c] || 0);
      return { c, actual, bud, diff: bud - actual, p: pct(actual, bud) };
    }).filter(r => r.actual > 0 || r.bud > 0).sort((a, b) => b.actual - a.actual);
    const over = rows.filter(r => r.actual > r.bud);
    const analysis = '该月共支出 <b>¥' + XQ.money(st.spent, { dec: 0 }) + '</b>，预算 ¥' + XQ.money(st.budget, { dec: 0 }) + '，' + (diff >= 0 ? '结余 <b>¥' + XQ.money(diff, { dec: 0 }) + '</b>' : '超支 <b>¥' + XQ.money(-diff, { dec: 0 }) + '</b>') + '，预算执行率 ' + p.toFixed(0) + '%。' +
      (over.length ? '超支类目为' + over.map(o => '「' + o.c + '」').join('、') + '，其中「' + over[0].c + '」超出预算 ¥' + XQ.money(over[0].actual - over[0].bud, { dec: 0 }) + '。' : '所有类目均在预算范围内。') +
      ' 小青建议：下月优先压缩' + (over[0] ? over[0].c : '非必需支出') + '，并将节省的金额转入学习或竞赛专项。';
    return '<div class="card card-pad">' +
      '<div class="report-head"><div class="report-title"><b>' + monthLabel(m) + ' 决算报告</b><span>预算与实际支出对比 · 自动生成</span></div>' +
        '<div class="row"><select class="select" style="width:130px;height:32px;font-size:12px" data-change="fin.reportMonth">' +
          [THIS_MONTH].concat(F().history.map(h => h.month).reverse()).map(x => '<option value="' + x + '" ' + (x === m ? 'selected' : '') + '>' + monthLabel(x) + '</option>').join('') +
        '</select><button class="btn sm" data-act="fin.exportReport" data-format="pdf">' + XQ.icon('download', 14) + 'PDF</button><button class="btn sm" data-act="fin.exportReport" data-format="word">Word</button><button class="btn sm" data-act="fin.exportReport" data-format="excel">Excel</button></div></div>' +
      '<div class="stat-grid" style="margin-bottom:18px">' +
        stat('总支出', '¥' + XQ.money(st.spent, { dec: 0 }), st.isHist ? '历史账单汇总' : '本月实时数据', 'wallet') +
        stat('预算', '¥' + XQ.money(st.budget, { dec: 0 }), '月度预算额度', 'target') +
        stat(diff >= 0 ? '结余' : '超支', '¥' + XQ.money(Math.abs(diff), { dec: 0 }), '执行率 ' + p.toFixed(0) + '%', 'chart') +
        stat('最大支出类目', rows[0] ? rows[0].c : '—', rows[0] ? '¥' + XQ.money(rows[0].actual, { dec: 0 }) : '暂无数据', 'list') +
      '</div>' +
      '<div class="grid-2" style="align-items:start"><div><div class="card-title" style="margin-bottom:10px">' + XQ.icon('chart', 16) + '预算 vs 实际</div>' +
        XQ.chart.bars(rows.map(r => ({ label: r.c, value: r.actual, value2: r.bud, color: r.actual > r.bud ? '#e0576b' : '#0f9d76' })), { h: 180 }) +
        '<div class="row tiny muted" style="justify-content:center;gap:14px;margin-top:2px"><span><i style="display:inline-block;width:8px;height:8px;background:#0f9d76;border-radius:2px;margin-right:3px"></i>实际</span><span><i style="display:inline-block;width:8px;height:8px;background:#dbe6e2;border-radius:2px;margin-right:3px"></i>预算</span></div></div>' +
        '<div><div class="ai-text"><div class="at-head">' + XQ.icon('sparkle') + '小青的决算分析</div>' + analysis + '</div>' +
          '<div class="demo-note" style="margin-top:10px">' + XQ.icon('info') + '<div>预警判断由规则引擎阈值打底，AI 负责生成可解释的原因说明与调整建议。</div></div></div></div>' +
      '<div class="divider"></div><div class="card-title" style="margin-bottom:8px">' + XQ.icon('list', 16) + '类目明细</div>' +
      '<div class="breakdown" style="font-size:10.5px;color:var(--muted);font-weight:600"><span>类目</span><span class="n">预算</span><span class="n">实际</span><span class="n">差额</span></div>' +
      rows.map(r => '<div class="breakdown"><div class="bd-name"><i style="width:8px;height:8px;border-radius:3px;background:' + (XQ.finCats[r.c] || XQ.finCats['其他']).color + '"></i>' + r.c + (r.actual > r.bud ? ' <span class="badge rose">超支</span>' : '') + '</div><span class="n muted">¥' + XQ.money(r.bud, { dec: 0 }) + '</span><span class="n">¥' + XQ.money(r.actual, { dec: 0 }) + '</span><span class="n" style="color:' + (r.diff < 0 ? 'var(--rose)' : 'var(--primary)') + '">' + (r.diff < 0 ? '−' : '+') + '¥' + XQ.money(Math.abs(r.diff), { dec: 0 }) + '</span></div>').join('') +

      '<h2>决算分析</h2><p style="text-indent:2em">' + (diff >= 0 ? '本月支出控制在预算范围内。' : '本月支出超出预算，建议关注高支出类目。') + '建议下月保持预算总额不变，优先压缩非必需消费，并将结余转入学习与竞赛专项。</p>';
    if (fmt === 'word') XQ.exportWord('小青 · ' + monthLabel(m) + '决算报告', html);
    else XQ.printDoc('小青 · ' + monthLabel(m) + '决算报告', html);
  });

  /* ---------- warnings ---------- */
  function buildAlerts() {
    const m = curMonth();
    const spent = spentOf(m);
    const budget = F().monthlyBudget;
    const cs = catSpentOf(m);
    const out = [];
    const near = F().alertSettings.near, single = F().alertSettings.single, catNear = F().alertSettings.categoryNear;
    const p = pct(spent, budget);
    if (p >= near) out.push({ lv: 1, type: '预算预警', title: '本月预算已使用 ' + p.toFixed(0) + '%', desc: '已支出 ¥' + XQ.money(spent, { dec: 0 }) + '，距离预算上限仅剩 ¥' + XQ.money(Math.max(0, budget - spent), { dec: 0 }) + '。按当前节奏，本月可能超支。', action: 'budget', actionText: '调整预算' });
    Object.keys(cs).forEach(c => {
      const b = F().categoryBudgets[c] || 0;
      if (!b) return;
      const cp = pct(cs[c], b);
      if (cp >= 100) out.push({ lv: 2, type: '开支预警', title: '「' + c + '」类目已超支', desc: '已支出 ¥' + XQ.money(cs[c], { dec: 0 }) + '，超出类目预算 ¥' + XQ.money(cs[c] - b, { dec: 0 }) + '（' + cp.toFixed(0) + '%）。主要来自「双十一 · 冲锋衣」¥299。', action: 'detail', cat: c, actionText: '查看明细' });
      else if (cp >= catNear) out.push({ lv: 1, type: '预算预警', title: '「' + c + '」类目接近上限', desc: '已使用 ' + cp.toFixed(0) + '%（¥' + XQ.money(cs[c], { dec: 0 }) + ' / ¥' + XQ.money(b, { dec: 0 }) + '），建议控制后续开支。', action: 'detail', cat: c, actionText: '查看明细' });
    });
    monthTx(m).filter(t => t.type === 'expense' && t.amount >= single).forEach(t => {
      out.push({ lv: 2, type: '开支预警', title: '单笔支出 ¥' + XQ.money(t.amount, { dec: 0 }) + ' 偏高', desc: XQ.dt.cn(t.date) + ' 的「' + t.note + '」单笔金额超过 ¥' + single + ' 阈值，占总支出 ' + pct(t.amount, spent).toFixed(0) + '%。', action: 'detail', cat: t.category, actionText: '查看记录' });
    });
    const last = F().history[F().history.length - 1];
    if (last && last.spent > last.budget) {
      out.push({ lv: 3, type: '决算预警', title: monthLabel(last.month) + '决算超支 ' + pct(last.spent - last.budget, last.budget).toFixed(0) + '%', desc: '上月实际支出 ¥' + XQ.money(last.spent, { dec: 0 }) + '，预算 ¥' + XQ.money(last.budget, { dec: 0 }) + '，主要超支类目为餐饮（¥720）与娱乐（¥250）。本月已自动收紧相关类目建议。', action: 'report', actionText: '查看决算' });
    }
    return out;
  }

      '<div style="display:flex;flex-direction:column;gap:14px">' +
        '<div class="card card-pad"><div class="card-title" style="margin-bottom:10px">' + XQ.icon('settings', 16) + '预警阈值</div>' +
          '<div class="field" style="margin-bottom:11px"><label>预算接近上限提醒</label><div class="row"><input class="input" type="number" id="setNear" value="' + F().alertSettings.near + '" style="width:90px"><span class="small muted">%</span></div></div>' +
          '<div class="field" style="margin-bottom:11px"><label>单笔大额提醒</label><div class="row"><span class="small muted">¥</span><input class="input" type="number" id="setSingle" value="' + F().alertSettings.single + '" style="width:110px"></div></div>' +
          '<button class="btn sm primary" data-act="fin.saveAlert">保存阈值</button>' +
          '<div class="divider"></div><div class="small muted" style="line-height:1.8">判断逻辑：规则引擎按阈值触发，再由 AI 结合历史数据生成原因说明与调整建议，做到「有依据、说得清」。</div></div>' +
        '<div class="card card-pad"><div class="card-title" style="margin-bottom:8px">' + XQ.icon('sparkle', 16) + '关联建议</div><div class="ai-text"><div class="at-head">' + XQ.icon('sparkle') + '本月的三个动作</div>① 将「购物」类目下月预算从 ¥350 降至 ¥280；<br>② 为挑战杯预留的 ¥300 已占预算，注意本月剩余现金流；<br>③ 餐饮尚有 ¥90 空间，建议优先食堂、减少外卖。</div></div>' +
      '</div></div>';
  }
  XQ.on('fin.alertAction', el => {
    const d = el.dataset.do;
    if (d === 'budget') { XQ.ui.tab.finance = 'budget'; XQ.render(); }
    else if (d === 'report') { XQ.ui.tab.finance = 'report'; XQ.render(); }
    else if (d === 'detail') { XQ.ui.finCat = el.dataset.cat || 'all'; XQ.ui.tab.finance = 'detail'; XQ.render(); }
  });
  XQ.on('fin.alertIgnore', () => XQ.toast('已设置稍后提醒', 'warn'));
  XQ.on('fin.saveAlert', () => {
    const near = Number((document.getElementById('setNear') || {}).value);
    const single = Number((document.getElementById('setSingle') || {}).value);
    if (near) F().alertSettings.near = Math.min(100, Math.max(10, near));
    if (single) F().alertSettings.single = single;
    XQ.store.save(); XQ.render(); XQ.toast('预警阈值已更新');
  });

  XQ.on('fin.exportDetail', () => {
    const list = filteredTx();
    const rows = [['日期', '类型', '类目', '金额', '备注', '记账方式']].concat(list.map(t => [t.date, t.type === 'income' ? '收入' : '支出', t.category, t.amount, t.note, t.method]));
    XQ.exportCSV('小青收支明细', rows);
  });

  /* ---------- view ---------- */
  XQ.views.finance = function () {
    const t = XQ.ui.tab.finance;
    let body = '';
    if (t === 'overview') body = overview();
    else if (t === 'detail') body = detail();
    else if (t === 'budget') body = budgetPage();
    else if (t === 'report') body = report();
    else body = warningsPage();
    return head() + body;
  };
})();

<script>/* research.js */
/* 小青 1.0 · 科研及竞赛管理 */
(function () {

    ['compliance', 'shield', '合规风控']

  function head() {
    return `<div class="page-head"><div><div class="page-title">科研及竞赛管理 <span class="tag-demo" title="文献、申报书、检测等内容为模板演示">全生命周期工作台</span></div>
      <div class="page-desc">从立项、文献、经费到结题与成果归档，一个工作台管完。项目节点自动进入日程，经费支出与个人账本、预算预留打通。</div></div>
      <div class="page-actions">
        <button class="btn" data-act="rs.exportDash">${XQ.icon('download')}导出工作台</button>
        <button class="btn" data-act="openAssistant">${XQ.icon('sparkle')}问小青</button>
        <button class="btn primary" data-act="rs.newProject">${XQ.icon('plus')}新建项目</button>
      </div></div>
      <div class="tabs">${TABS.map(t => `<button class="tab ${ui.tab.research === t[0] ? 'active' : ''}" data-act="rs.tab" data-tab="${t[0]}">${XQ.icon(t[1], 15)}${t[2]}${t[0] === 'compliance' && R().riskItems.length ? `<span class="count">${R().riskItems.length}</span>` : ''}</button>`).join('')}</div>`;
