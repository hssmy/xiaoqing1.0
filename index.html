  XQ.on('rs.tab', el => { ui.tab.research = el.dataset.tab; if (el.dataset.tab !== 'projects') ui.researchProject = null; XQ.render(); });

  function stat(label, value, hint, icon) {
    return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-hint">${hint}</div><div class="stat-ico">${XQ.icon(icon, 16)}</div></div>`;
  }
  function allTasks(p) { return p.tasks || []; }
  function openTasks(p) { return allTasks(p).filter(t => t.status !== 'done').length; }
  function nextMilestone(p) {
    return (p.milestones || []).filter(m => m.status !== 'done').sort((a, b) => a.date.localeCompare(b.date))[0] || null;
  }
  function projectById(id) { return R().projects.find(p => p.id === id); }
  function statusBadge(s) {
    return `<span class="badge ${s === '进行中' ? 'green' : s === '已结题' ? 'gray' : 'amber'}">${s}</span>`;
  }
  function levelColor(l) {
    return l.indexOf('国家') >= 0 ? '#e0576b' : l.indexOf('省') >= 0 ? '#e8912d' : l.indexOf('校') >= 0 ? '#7a5cf0' : '#0f9d76';
  }

  /* ================= dashboard ================= */
  function scopeStats() {
    const scope = ui.researchScope;
    const ps = R().projects;
    const active = ps.filter(p => p.status === '进行中');
    const spent = ps.reduce((s, p) => s + Number(p.spent || 0), 0);
    const budget = ps.reduce((s, p) => s + Number(p.budget || 0), 0);
    const open = ps.reduce((s, p) => s + openTasks(p), 0);
    if (scope === 'team') {
      return { projects: active.length, spend: spent, budget: budget, open: open, members: 5, outputs: R().papers.length, literature: R().literature.length, risks: R().riskItems.length, org: false };
    }
    if (scope === 'org') {
      return { projects: 128, spend: 862000, budget: 1200000, open: 46, members: 412, outputs: 312, literature: 1860, risks: 17, org: true };
    }
    return { projects: active.length, spend: spent, budget: budget, open: open, members: 1, outputs: R().papers.length, literature: R().literature.length, risks: R().riskItems.length, org: false };
  }
  function upcomingItems() {
    const out = [];
    R().projects.filter(p => p.status === '进行中').forEach(p => {
      (p.milestones || []).forEach(m => {
        if (m.status !== 'done' && m.date >= TODAY()) out.push({ project: p, title: m.title, date: m.date, days: XQ.dt.diffDays(m.date) });
      });

    return out.sort((a, b) => a.date.localeCompare(b.date));
  }
  function dashboard() {
    const st = scopeStats();
    const up = upcomingItems();
    const active = R().projects.filter(p => p.status === '进行中');

    return `<div class="filter-bar"><span class="small muted">数据看板视角</span>

        <span class="spacer"></span><span class="badge outline">${st.org ? '计算机技术与应用学院 · 演示汇总' : '数据已同步 · ' + S().schedule.lastSync.slice(11)}</span></div>
      <div class="stat-grid">
        ${stat('进行中项目', st.projects, st.org ? '全院在研项目' : '含大创、挑战杯、开放课题', 'flask')}
        ${stat('经费执行', money(st.spend), '预算 ' + money(st.budget) + ' · ' + exec.toFixed(0) + '%', 'coin')}
        ${stat('待办任务', st.open, '跨项目汇总 · 按截止日排序', 'check')}
        ${stat('风险与提醒', st.risks, '进度 / 经费 / 合规', 'alert')}
      </div>
      <div class="home-grid" style="margin-top:16px">
        <div class="card card-pad">
          <div class="card-head"><div><div class="card-title">${XQ.icon('flask', 16)}项目进度</div><div class="card-sub">${st.org ? '按学院汇总展示' : '所有在研项目 · 进度与近期节点'}</div></div><button class="link" data-act="rs.tab" data-tab="projects">全部项目 ${XQ.icon('arrow', 13)}</button></div>
          ${R().projects.slice(0, st.org ? 3 : 4).map(p => {
            const pr = st.org ? Math.min(100, Math.round(p.progress * 0.9 + (p.id.charCodeAt(1) * 3) % 20)) : p.progress;
            return `<div class="row" style="gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2);cursor:pointer" data-act="rs.openProject" data-id="${p.id}">
              <div class="proj-badge" style="width:30px;height:30px;flex-basis:30px;font-size:12px;background:${levelColor(p.level)}18;color:${levelColor(p.level)}">${p.level.slice(0, 1)}</div>
              <div style="flex:1;min-width:0"><div class="row" style="gap:6px"><b class="small" style="font-weight:600">${q(p.short)}</b>${statusBadge(p.status)}</div>
                <div class="tiny muted" style="margin-top:2px">${q(p.type)} · ${q(p.role)}</div>
                <div class="progress thin ${pr >= 90 ? '' : pr < 30 ? 'warn' : ''}" style="margin-top:6px"><i style="width:${pr}%"></i></div></div>
              <div style="text-align:right;flex:0 0 62px"><b style="font-size:13px">${pr}%</b><div class="tiny muted">${openTasks(p)} 项待办</div></div></div>`;
          }).join('')}
          <div class="demo-note" style="margin-top:11px">${XQ.icon('info')}<div>${st.org ? '机构视角为演示汇总数据，用于展示院系科研管理看板形态。' : '进度由任务完成度、里程碑与经费执行综合计算；可在项目详情中手动更新。'}</div></div>
        </div>
        <div class="card card-pad">
          <div class="card-head"><div><div class="card-title">${XQ.icon('sparkle', 16)}7×24 科研助手</div><div class="card-sub">基于你的项目、文献与经费数据回答</div></div><span class="badge green">在线</span></div>
          <div class="row" style="gap:7px;margin-bottom:9px"><input class="input" id="rsAsk" placeholder="例如：大创中期材料还差什么？" style="flex:1"><button class="btn primary sm" data-act="rs.ask">${XQ.icon('send', 14)}</button></div>
          <div class="row wrap" style="gap:5px;margin-bottom:11px">${['中期检查要准备什么', '经费还能怎么用', '推荐几篇 RAG 文献', '当前最大的风险'].map(t => `<button class="chip" data-act="rs.askQuick" data-text="${t}">${t}</button>`).join('')}</div>
          ${answer ? `<div class="ai-text pop">${answer}</div>` : `<div class="ai-text"><div class="at-head">${XQ.icon('sparkle')}小青提示</div>你可以问项目节点、经费执行、文献推荐或合规风险。我会结合当前 ${R().projects.length} 个项目、${R().literature.length} 篇文献和 ${R().riskItems.length} 条风险给出可执行建议。</div>`}
        </div>
      </div>
      <div class="home-grid" style="margin-top:16px">
        <div class="card card-pad">
          <div class="card-head"><div><div class="card-title">${XQ.icon('timeline', 16)}近期节点</div><div class="card-sub">里程碑与竞赛截止 · 可一键加入日程</div></div><span class="badge amber">${up.length} 个待办节点</span></div>
          ${up.slice(0, 5).map(m => `<div class="row" style="gap:11px;padding:9px 0;border-bottom:1px solid var(--line-2)">
            <div style="flex:0 0 44px;text-align:center"><div style="font-size:16px;font-weight:700;color:${m.days <= 3 ? 'var(--rose)' : 'var(--ink)'}">${m.days}</div><div class="tiny muted">天后</div></div>
            <div style="flex:1;min-width:0"><b class="small">${q(m.title)}</b><div class="tiny muted">${q(m.project.short)} · ${XQ.dt.cnFull(m.date)}</div></div>
            <button class="btn sm soft" data-act="rs.milestoneToCal" data-id="${m.project.id}" data-title="${q(m.title)}" data-date="${m.date}">加入日程</button></div>`).join('') || '<div class="empty">暂无临近节点</div>'}
        </div>
        <div class="card card-pad">
          <div class="card-head"><div><div class="card-title">${XQ.icon('alert', 16)}风险雷达</div><div class="card-sub">进度、经费、合规三类风险</div></div><button class="link" data-act="rs.tab" data-tab="compliance">风险中心 ${XQ.icon('arrow', 13)}</button></div>
          ${R().riskItems.slice(0, 4).map(r => `<div class="risk-item"><span class="rlevel ${r.level}">${({ high: '高', mid: '中', low: '低' })[r.level]}</span><div style="flex:1"><b>${q(r.title)}</b><div class="tiny muted" style="margin-top:1px">${q(r.desc)}</div></div><span class="badge gray">${r.module}</span></div>`).join('')}
          <div class="divider"></div>
          <div class="row"><span class="small muted">本周新增 2 条 · 已处理 1 条</span><span class="spacer"></span><button class="btn sm" data-act="rs.tab" data-tab="compliance">去处理</button></div>
        </div>

      <div class="home-grid" style="margin-top:16px">
        <div class="card card-pad">

          ${R().projects.filter(p => p.status === '进行中').map(p => {
            const ep = pct(p.spent, p.budget);

  XQ.on('rs.scope', el => { ui.researchScope = el.dataset.s; XQ.render(); });

    } else {
      ans = `<div class="at-head">${XQ.icon('sparkle')}我能帮你做什么</div>你可以问我：项目节点、经费执行、文献推荐、申报书创新点、合规风险。也可以直接说「把中期检查加入日程」「推荐几篇 RAG 文献」「生成挑战杯申报书框架」。`;
    }

    XQ.store.save();
    XQ.render();

  /* ================= projects ================= */
  function projectCards() {
    const f = ui.projFilter;

    if (!list.length) return `<div class="empty" style="grid-column:1/-1"><div class="eico">${XQ.icon('flask', 22)}</div><b>没有符合条件的项目</b><span class="small">切换筛选条件，或新建一个项目</span><div style="margin-top:12px"><button class="btn sm primary" data-act="rs.newProject">新建项目</button></div></div>`;
    return list.map(p => {

      const risk = (p.risks || []).some(r => r.level === 'high');
      return `<div class="proj-card" data-act="rs.openProject" data-id="${p.id}">
        <div class="proj-top"><div class="proj-badge" style="background:${levelColor(p.level)}18;color:${levelColor(p.level)}">${XQ.icon(p.type.indexOf('竞赛') >= 0 || p.type.indexOf('挑战杯') >= 0 ? 'flag' : 'flask', 16)}</div>
          <div style="flex:1;min-width:0"><h4>${q(p.name)}</h4><div class="pmeta"><span>${q(p.type)}</span><span>${q(p.level)}</span><span>${q(p.role)}</span></div></div>

  function gantt(p) {
    const tasks = p.tasks || [];
    if (!tasks.length) return '<div class="empty">暂无任务</div>';
    const min = new Date((tasks.reduce((m, t) => t.start < m ? t.start : m, p.start)) + 'T00:00:00');
    const max = new Date((tasks.reduce((m, t) => t.end > m ? t.end : m, p.end)) + 'T00:00:00');
    const span = Math.max(1, XQ.dt.daysBetween(XQ.dt.iso(min), XQ.dt.iso(max)));
    const axis = Array.from({ length: 8 }, (_, i) => XQ.dt.cn(XQ.dt.iso(XQ.dt.addDays(min, Math.round(span * i / 7)))));
    const todayLeft = (TODAY() >= XQ.dt.iso(min) && TODAY() <= XQ.dt.iso(max)) ? XQ.dt.daysBetween(XQ.dt.iso(min), TODAY()) / span * 100 : -1;
    return `<div class="gantt"><div class="gantt-inner">
      <div class="gantt-axis">${axis.map(a => `<span>${a}</span>`).join('')}</div>
      ${tasks.map(t => {
        const left = Math.max(0, XQ.dt.daysBetween(XQ.dt.iso(min), t.start) / span * 100);
        const w = Math.max(4, XQ.dt.daysBetween(t.start, t.end) / span * 100);
        const cls = t.status === 'done' ? 'done' : t.status === 'doing' ? '' : 'todo';
        return `<div class="g-row"><div class="g-label" title="${q(t.title)}">${q(t.title)}</div><div class="g-track">${todayLeft >= 0 ? `<div class="gantt-today" style="left:${todayLeft}%"><i></i></div>` : ''}<div class="g-bar ${cls}" style="left:${left}%;width:${Math.min(100 - left, w)}%" title="${t.start} → ${t.end}">${q(t.assignee || '')}</div></div></div>`;
      }).join('')}
    </div></div>`;
  }

  function projectDetail(p) {

      <div class="card card-pad" style="background:linear-gradient(135deg,#faf8ff,#fff);border-color:#e8e1fb">

            <div class="row wrap" style="gap:6px;margin-top:8px"><span class="badge purple">${q(p.type)}</span><span class="badge gray">${q(p.role)}</span>${(p.members || []).map(m => `<span class="badge outline">${q(m)}</span>`).join('')}</div></div>

          ${stat('团队规模', (p.members || []).length + ' 人', q(p.members[0]) + ' 负责', 'user')}

      </div>
      <div class="filter-bar" style="margin-top:14px">${tabs.map(t => `<button class="chip ${tab === t[0] ? 'active' : ''}" data-act="rs.projTab" data-tab="${t[0]}">${t[1]}</button>`).join('')}<span class="spacer"></span><span class="small muted">${XQ.dt.cn(p.start)} — ${XQ.dt.cn(p.end)}</span></div>
      ${tab === 'overview' ? projectOverview(p) : tab === 'tasks' ? projectTasks(p) : tab === 'funds' ? projectFunds(p) : projectDocs(p)}`;
  }
  function projectOverview(p) {
    return `<div class="grid-2" style="align-items:start">
      <div class="card card-pad"><div class="card-head"><div><div class="card-title">${XQ.icon('timeline', 16)}里程碑</div><div class="card-sub">节点完成情况与倒计时</div></div></div>
        ${p.milestones.map(m => {

        }).join('')}
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card card-pad"><div class="card-title" style="margin-bottom:10px">${XQ.icon('alert', 16)}项目风险</div>
          ${p.risks.length ? p.risks.map(r => `<div class="risk-item"><span class="rlevel ${r.level}">${({ high: '高', mid: '中', low: '低' })[r.level]}</span><div><b>${q(r.title)}</b><div class="tiny muted">${q(r.desc)}</div></div></div>`).join('') : '<div class="small muted">暂无风险，保持节奏</div>'}

          <div class="ai-text"><div class="at-head">${XQ.icon('sparkle')}下一步怎么做</div>${p.status === '已结题' ? '项目已结题，建议整理成果台账、归档数据与代码，并评估后续论文或专利转化。' : '距离「' + (nextMilestone(p) ? nextMilestone(p).title : '结题') + '」还有 ' + (nextMilestone(p) ? Math.max(0, XQ.dt.diffDays(nextMilestone(p).date)) : 0) + ' 天。优先完成 ' + (p.tasks.filter(t => t.status !== 'done')[0] ? '「' + p.tasks.filter(t => t.status !== 'done')[0].title + '」' : '成果整理') + '，并同步检查经费票据是否齐全。'}</div></div>
      </div>

  function projectTasks(p) {

      <div class="divider"></div>

  function projectFunds(p) {
    return `<div class="grid-2" style="align-items:start">
      <div class="card card-pad"><div class="card-head"><div><div class="card-title">${XQ.icon('coin', 16)}经费科目</div><div class="card-sub">${money(p.spent)} / ${money(p.budget)} · 执行率 ${pct(p.spent, p.budget).toFixed(0)}%</div></div><button class="btn sm" data-act="rs.tab" data-tab="funds">完整经费页</button></div>

        ${p.expenditures.length ? p.expenditures.map(e => `<div class="paper-row"><div class="paper-ico" style="background:#fdf1e3;color:#e8912d">${XQ.icon('coin', 14)}</div><div style="flex:1;min-width:0"><b class="small">${q(e.item)}</b><div class="tiny muted">${e.date} · ${q(e.cat)}</div></div><b class="small num">${money(e.amount)}</b><span class="badge ${e.status === '已报销' ? 'green' : e.status === '待审核' ? 'amber' : 'gray'}">${e.status}</span></div>`).join('') : '<div class="empty">暂无支出记录</div>'}

  function projectDocs(p) {

        ${p.docs.length ? p.docs.map(d => `<div class="paper-row"><div class="paper-ico">${XQ.icon('file', 14)}</div><div style="flex:1;min-width:0"><b class="small">${q(d.name)}</b><div class="tiny muted">${d.size} · ${d.date}</div></div><button class="btn sm ghost" data-act="rs.docPreview" data-id="${p.id}" data-name="${q(d.name)}">预览</button></div>`).join('') : '<div class="empty">还没有归档文档</div>'}
      </div>
      <div class="card card-pad"><div class="card-head"><div><div class="card-title">${XQ.icon('mic', 16)}组会纪要</div><div class="card-sub">讨论结论与任务分工</div></div><button class="btn sm primary" data-act="rs.newMeeting" data-id="${p.id}">${XQ.icon('plus', 14)}记录组会</button></div>
        ${p.meetings.length ? p.meetings.map(m => `<div style="padding:11px 0;border-bottom:1px solid var(--line-2)"><div class="row"><b class="small">${q(m.title)}</b><span class="spacer"></span><span class="tiny muted">${m.date}</span></div><div class="small muted" style="margin-top:4px;line-height:1.7">${q(m.summary)}</div></div>`).join('') : '<div class="empty">暂无组会记录</div>'}
      </div>

  }
  XQ.on('rs.backProjects', () => { ui.researchProject = null; XQ.render(); });
  XQ.on('rs.projTab', el => { ui.projTab = el.dataset.tab; XQ.render(); });

  XQ.on('rs.toggleTask', el => {
    const p = projectById(el.dataset.pid);
    if (!p) return;
    const t = p.tasks.find(x => x.id === el.dataset.id);
    if (!t) return;
    t.status = t.status === 'done' ? 'doing' : 'done';
    const done = p.tasks.filter(x => x.status === 'done').length;
    p.progress = Math.round(done / p.tasks.length * 100);

  XQ.on('rs.saveProject', form => {
    const fd = new FormData(form);
    const id = fd.get('id');
    const data = {
      name: (fd.get('name') || '').trim(), short: (fd.get('short') || '').trim() || (fd.get('name') || '').slice(0, 8),
      type: fd.get('type'), level: fd.get('level'), role: fd.get('role'),
      start: fd.get('start'), end: fd.get('end'), budget: Number(fd.get('budget')) || 0,
      desc: fd.get('desc') || ''
    };
    if (!data.name) { XQ.toast('请填写项目名称', 'err'); return; }
    if (id) {
      const p = projectById(id);
      if (p) Object.assign(p, data);
      XQ.toast('项目信息已更新');
    } else {
      const p = Object.assign({
        id: XQ.uid('p'), status: '进行中', progress: 0, spent: 0, members: [S().user.name],

  function litFiltered() {

    if (ui.litSort === 'cite') list.sort((a, b) => b.citations - a.citations);
    else if (ui.litSort === 'year') list.sort((a, b) => b.year - a.year);
    else list.sort((a, b) => b.score - a.score);
    return list;
  }
  function litItem(l, idx) {
    const sel = ui.litCompare.indexOf(l.id) >= 0;
    return `<div class="lit-item">
      <label style="display:flex;align-items:center;margin-top:3px;cursor:pointer" title="加入对比"><input type="checkbox" data-act="rs.litCompare" data-id="${l.id}" ${sel ? 'checked' : ''} style="width:14px;height:14px;accent-color:var(--primary)"></label>
      <div class="lit-idx">${idx + 1}</div>
      <div class="lit-main">
        <div class="lit-title" data-act="rs.litDetail" data-id="${l.id}">${q(l.title)}</div>
        <div class="lit-meta"><span>${q(l.authors)}</span><span class="badge gray">${q(l.venue)}</span><span>${l.year}</span><span>${q(l.source)}</span><span>引用 ${l.citations}</span>${l.impact !== '—' ? `<span>IF ${l.impact}</span>` : ''}</div>
        <div class="lit-abs">${q(l.abstract)}</div>
        <div class="lit-tags">${l.tags.map(t => `<span class="chip" style="height:21px;font-size:9.5px;padding:0 7px" data-act="rs.litTag" data-tag="${q(t)}">${q(t)}</span>`).join('')}${l.saved ? '<span class="badge green">已收藏</span>' : ''}</div>
      </div>
      <div class="lit-score"><b>${l.score}</b><span>相关度</span></div>
      <div class="lit-actions"><button class="btn sm ${l.saved ? '' : 'soft'}" data-act="rs.litSave" data-id="${l.id}">${l.saved ? '取消收藏' : '收藏'}</button><button class="btn sm ghost" data-act="rs.litDetail" data-id="${l.id}">精读</button></div>
    </div>`;
  }
  function topicGraph() {
    const counts = {};
    R().literature.forEach(l => l.tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
    const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 7);
    const cx = 300, cy = 130, R0 = 96;
    const nodes = tags.map((t, i) => {
      const a = Math.PI * 2 * i / tags.length - Math.PI / 2;
      return { t, n: counts[t], x: cx + Math.cos(a) * R0, y: cy + Math.sin(a) * R0 * 0.72, r: 8 + counts[t] * 1.6 };
    });
    const edges = nodes.map(n => `<line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="#dfeae6" stroke-width="1.2"/>`).join('');
    const dots = nodes.map(n => `<g style="cursor:pointer" data-act="rs.litTag" data-tag="${q(n.t)}"><circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="#0f9d76" opacity=".14"/><circle cx="${n.x}" cy="${n.y}" r="4" fill="#0f9d76"/><text x="${n.x}" y="${n.y + n.r + 11}" font-size="9" fill="#5c6b66" text-anchor="middle">${q(n.t)}</text></g>`).join('');
    return `<svg viewBox="0 0 600 270" width="100%" height="240">${edges}<circle cx="${cx}" cy="${cy}" r="24" fill="#0f9d76" opacity=".14"/><circle cx="${cx}" cy="${cy}" r="18" fill="#0f9d76"/><text x="${cx}" y="${cy + 3}" font-size="9" fill="#fff" text-anchor="middle">文献库</text>${dots}</svg>`;
  }

    </div>
    <div class="filter-bar">
      <span class="small muted">文献库 ${R().literature.length} 篇</span><span class="spacer"></span>
      ${['all', 'arXiv', '知网', 'Web of Science'].map(s => `<button class="chip ${ui.litSource === s ? 'active' : ''}" data-act="rs.litSource" data-s="${s}">${s === 'all' ? '全部来源' : s}</button>`).join('')}

    <div class="grid-2" style="grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start">
      <div class="card" style="overflow:hidden"><div class="row" style="padding:12px 15px;border-bottom:1px solid var(--line)"><span class="small" style="font-weight:600">检索结果 ${list.length} 篇</span><span class="spacer"></span><span class="tiny muted">相关度由语义相似度、引用量与来源权威度综合计算</span></div>

      body: `<form data-act="rs.saveOutput" id="outputForm"><div class="form-grid"><div class="field full"><label>成果名称 <span class="req">*</span></label><input class="input" name="title" required placeholder="例如：基于 RAG 的校园问答方法"></div><div class="field"><label>成果类型</label><select class="select" name="type">${['期刊论文', '会议论文', '软件著作权', '专利', '竞赛奖项'].map(x => `<option>${x}</option>`).join('')}</select></div><div class="field"><label>状态</label><select class="select" name="status">${['草稿', '在投', '已录用', '已发表', '已登记', '已获奖'].map(x => `<option>${x}</option>`).join('')}</select></div><div class="field"><label>发表/获奖单位</label><input class="input" name="venue" placeholder="期刊、会议或颁奖单位"></div><div class="field"><label>我的角色</label><select class="select" name="role">${['第一作者', '第二作者', '通讯作者', '第一完成人', '队长', '参与'].map(x => `<option>${x}</option>`).join('')}</select></div><div class="field"><label>日期</label><input class="input" type="date" name="date" value="${TODAY()}"></div><div class="field"><label>被引次数</label><input class="input" type="number" name="cites" value="0"></div><div class="field"><label>级别 / 分区</label><input class="input" name="quartile" placeholder="例如：中文核心 / 省级"></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn primary">保存成果</button></div></form>`,
      footer: false
    });
  });
  XQ.on('rs.saveOutput', form => {
    const fd = new FormData(form);
    const title = (fd.get('title') || '').trim();
    if (!title) { XQ.toast('请填写成果名称', 'err'); return; }
    R().papers.unshift({ id: XQ.uid('pa'), title, type: fd.get('type'), status: fd.get('status'), venue: fd.get('venue') || '—', role: fd.get('role'), date: fd.get('date'), cites: Number(fd.get('cites')) || 0, quartile: fd.get('quartile') || '—' });
    XQ.store.save(); XQ.closeModal(); XQ.render(); XQ.toast('成果已登记，可在结题材料中引用');
  });
  XQ.on('rs.outputExport', () => {
    XQ.exportCSV('小青科研成果台账', [['成果名称', '类型', '状态', '单位', '角色', '日期', '被引', '级别']].concat(R().papers.map(p => [p.title, p.type, p.status, p.venue, p.role, p.date, p.cites, p.quartile])));
  });
  XQ.on('rs.kbOpen', el => { XQ.toast('已打开知识库「' + el.dataset.name + '」（演示）'); });
  XQ.on('rs.kbUpload', () => XQ.toast('文件已上传到团队知识库（演示）'));

  /* ================= compliance ================= */
  function complianceScore() {
    const risks = R().riskItems;
    return Math.max(40, Math.min(100, 100 - risks.filter(r => r.level === 'high').length * 7 - risks.filter(r => r.level === 'mid').length * 3 - risks.filter(r => r.level === 'low').length));
  }
  function compliancePage() {
    const score = complianceScore();
    const groups = [
      { name: '学术诚信', icon: 'file', items: [['查重与相似度', 'ok', '申报书总相似度 12.4%，低于 20% 预警线'], ['AI 生成内容标注', 'ok', 'AI 辅助内容占比 6.0%，已按要求标注'], ['引用格式一致性', 'warn', 'GB/T 7714 与 APA 混用 2 处，建议统一'], ['数据与代码可复现', 'ok', '实验数据、脚本与随机种子已归档']] },
      { name: '经费合规', icon: 'coin', items: [['预算科目与总额匹配', 'ok', '科目合计与总预算一致'], ['大额采购审批', 'warn', '1 笔 ¥1,200 设备租赁缺少比价材料'], ['劳务费比例与发放', 'warn', '大创劳务费已执行 100%，需调剂'], ['票据完整性', 'ok', '已报销支出均附发票与验收单']] },
      { name: '数据合规', icon: 'lock', items: [['个人信息脱敏', 'ok', '学号、手机号等字段已脱敏'], ['数据存储位置', 'ok', '敏感数据仅存本机，不上传云端'], ['数据共享协议', 'warn', '3 份访谈数据缺少共享授权说明'], ['采集告知与同意', 'ok', '问卷首屏已包含知情同意说明']] },
      { name: '伦理审查', icon: 'shield', items: [['人类被试研究备案', 'ok', '已通过学院伦理审查（编号 QHU-2026-031）'], ['知情同意书', 'ok', '电子知情同意书已归档'], ['弱势群体保护', 'ok', '未涉及未成年人等弱势群体'], ['伦理变更报备', 'ok', '暂无研究方案变更']] }
    ];
    return `<div class="card card-pad" style="background:linear-gradient(135deg,#f4fbf8,#fff);border-color:#dcefe7;margin-bottom:16px">
      <div class="row" style="gap:18px;flex-wrap:wrap;align-items:center"><div class="score-ring">${XQ.chart.ring(score, 104, score >= 85 ? '#0f9d76' : score >= 70 ? '#e8912d' : '#e0576b')}</div>
        <div style="flex:1;min-width:240px"><div class="card-title" style="font-size:16px">合规健康度 ${score} 分</div><div class="card-sub">覆盖学术诚信、经费、数据与伦理四类规则；风险按高 / 中 / 低分级</div>
          <div class="row wrap" style="gap:6px;margin-top:9px"><span class="badge rose">高风险 ${R().riskItems.filter(r => r.level === 'high').length}</span><span class="badge amber">中风险 ${R().riskItems.filter(r => r.level === 'mid').length}</span><span class="badge green">低风险 ${R().riskItems.filter(r => r.level === 'low').length}</span></div></div>
        <div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm primary" data-act="rs.integrityCheck">${XQ.icon('search', 14)}学术诚信检测</button><button class="btn sm" data-act="rs.ethics">${XQ.icon('shield', 14)}伦理审查申请</button><button class="btn sm soft" data-act="rs.complianceExport">${XQ.icon('download', 14)}导出合规报告</button></div></div>
    </div>
    <div class="filter-bar"><button class="chip ${ui.complianceView === 'checks' ? 'active' : ''}" data-act="rs.complianceView" data-v="checks">合规检查</button><button class="chip ${ui.complianceView === 'risks' ? 'active' : ''}" data-act="rs.complianceView" data-v="risks">风险中心</button><span class="spacer"></span><span class="tiny muted">规则引擎每日 08:00 自动巡检</span></div>
    ${ui.complianceView === 'checks' ? `<div class="grid-2">${groups.map(g => `<div class="card card-pad"><div class="card-head"><div><div class="card-title">${XQ.icon(g.icon, 16)}${g.name}</div><div class="card-sub">${g.items.filter(i => i[1] === 'ok').length} / ${g.items.length} 项通过</div></div><span class="badge ${g.items.some(i => i[1] === 'warn') ? 'amber' : 'green'}">${g.items.some(i => i[1] === 'warn') ? '需关注' : '正常'}</span></div>${g.items.map(i => `<div class="check-row"><div class="ck ${i[1]}">${XQ.icon(i[1] === 'ok' ? 'check' : 'alert')}</div><div style="flex:1"><b>${i[0]}</b><span>${i[2]}</span></div>${i[1] !== 'ok' ? `<button class="btn sm ghost" data-act="rs.fixCheck" data-name="${i[0]}">处理</button>` : ''}</div>`).join('')}</div>`).join('')}</div>` : riskCenter()}
    <div class="card card-pad" style="margin-top:16px"><div class="card-head"><div><div class="card-title">${XQ.icon('sparkle', 16)}小青的合规建议</div><div class="card-sub">按优先级排序的可执行动作</div></div><span class="badge purple">AI 解释</span></div>
      <div class="ai-text"><div class="at-head">${XQ.icon('sparkle')}本周先做这三件事</div>① <b>补大额采购比价材料</b>：GPU 云服务器租用 ¥1,200，需附 3 家报价或单一来源说明；<br>② <b>统一引用格式</b>：申报书中 2 处 APA 改为 GB/T 7714，可在「报告排版」一键重排；<br>③ <b>补齐数据共享授权</b>：3 份访谈数据需补充授权说明，避免结题时被退回。</div></div>`;
  }
  XQ.on('rs.complianceView', el => { ui.complianceView = el.dataset.v; XQ.render(); });
  function riskCenter() {
    return `<div class="card card-pad"><div class="card-head"><div><div class="card-title">${XQ.icon('alert', 16)}风险中心</div><div class="card-sub">进度、经费、合规风险统一处理</div></div><span class="badge rose">${R().riskItems.filter(r => r.level === 'high').length} 条高风险</span></div>
      ${R().riskItems.map((r, i) => `<div class="row" style="gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)"><span class="badge ${r.level === 'high' ? 'rose' : r.level === 'mid' ? 'amber' : 'green'}">${({ high: '高', mid: '中', low: '低' })[r.level]}</span><div style="flex:1"><b class="small">${q(r.title)}</b><div class="tiny muted" style="margin-top:2px">${q(r.desc)}</div></div><span class="badge gray">${r.module}</span><button class="btn sm soft" data-act="rs.riskGo" data-module="${r.module}" data-i="${i}">去处理</button></div>`).join('')}
      <div class="demo-note" style="margin-top:10px">${XQ.icon('info')}<div>风险由规则引擎根据任务逾期、经费阈值与合规清单自动生成；处理后可在对应模块更新数据。</div></div></div>`;
  }
  XQ.on('rs.riskGo', el => {
    const m = el.dataset.module;
    if (m === '进度') { ui.tab.research = 'projects'; ui.researchProject = 'p1'; ui.projTab = 'overview'; }
    else if (m === '经费') { ui.tab.research = 'funds'; }
    else { ui.tab.research = 'compliance'; ui.complianceView = 'checks'; }
    XQ.render(); XQ.toast('已定位到「' + m + '」相关问题');
  });
  XQ.on('rs.fixCheck', el => {
    XQ.toast('已创建待办：' + el.dataset.name + '（演示）');
  });
  XQ.on('rs.integrityCheck', () => {
    XQ.modal({
      title: '学术诚信检测', sub: '查重 + AI 生成识别 + 引用核验 · 演示',
      body: `<div class="field"><label>待检测文本</label><textarea class="textarea" rows="6" id="integrityText">高校校园信息分散在教务、学工、PU 与公众号等多个渠道，学生需要反复切换平台，容易漏读重要通知。现有工具多停留在关键词提醒，缺乏跨来源去重、优先级判定与日程自动生成能力。本项目拟构建一个可自动采集、理解与聚合多源通知的智能体。</textarea><div class="hint">粘贴申报书、论文或报告正文；正式版支持 Word / PDF 上传。</div></div><div id="integrityResult"></div>`,
      footer: '<button class="btn" data-close>关闭</button><button class="btn primary" id="runIntegrity">开始检测</button>',
      onMount: mask => {
        mask.querySelector('#runIntegrity').addEventListener('click', () => {
          const out = mask.querySelector('#integrityResult');
          out.innerHTML = `<div class="row" style="margin-top:12px"><div class="spin">${XQ.icon('sync', 18)}</div><span class="small muted">正在比对公开文献与网络资源…</span></div>`;
          setTimeout(() => {
            out.innerHTML = `<div class="divider"></div><div class="grid-3" style="gap:10px"><div class="card card-pad" style="text-align:center"><div class="tiny muted">总相似度</div><b style="font-size:20px;color:var(--primary)">12.4%</b></div><div class="card card-pad" style="text-align:center"><div class="tiny muted">AI 生成占比</div><b style="font-size:20px">6.0%</b></div><div class="card card-pad" style="text-align:center"><div class="tiny muted">引用问题</div><b style="font-size:20px;color:var(--amber)">2 处</b></div></div><div class="ai-text" style="margin-top:10px"><div class="at-head">${XQ.icon('sparkle')}检测结论</div>文本原创性良好，未发现大段复制。建议补充 2 处引用标注，并在方法部分说明 AI 辅助范围。</div>`;
          }, 1200);
        });
      }
    });
  });
  XQ.on('rs.ethics', () => {
    XQ.modal({
      title: '伦理审查申请', sub: '人类被试研究 · 快速申报',
      body: `<div class="form-grid"><div class="field"><label>研究类型</label><select class="select"><option>问卷调查</option><option>访谈研究</option><option>行为实验</option><option>数据分析（已脱敏）</option></select></div><div class="field"><label>涉及人数</label><input class="input" type="number" value="180"></div><div class="field full"><label>研究目的</label><textarea class="textarea" rows="2">分析大学生时间管理与学业表现的关系，为学习助手策略提供依据。</textarea></div><div class="field full"><label>数据与隐私保护措施</label><textarea class="textarea" rows="2">匿名化处理，仅采集必要字段；数据存储于本地加密目录；结果仅以汇总形式呈现。</textarea></div></div><div class="demo-note" style="margin-top:10px">${XQ.icon('shield')}<div>提交后将生成受理编号，正式审查由学院伦理委员会完成。</div></div>`,
      footer: '<button class="btn" data-close>取消</button><button class="btn primary" id="submitEthics">提交申请</button>',
      onMount: mask => {
        mask.querySelector('#submitEthics').addEventListener('click', () => {
          XQ.closeModal(); XQ.toast('伦理审查申请已提交，受理编号 QHU-2026-047');
        });
      }
    });
  });
  XQ.on('rs.complianceExport', () => {
    const score = complianceScore();
    const html = `<h2>科研项目合规报告</h2><p style="text-indent:0">合规健康度：${score} 分　高风险：${R().riskItems.filter(r => r.level === 'high').length} 条　中风险：${R().riskItems.filter(r => r.level === 'mid').length} 条</p><h3>风险清单</h3>${R().riskItems.map(r => `<p style="text-indent:0">【${({ high: '高', mid: '中', low: '低' })[r.level]}】${q(r.title)}（${r.module}）：${q(r.desc)}</p>`).join('')}<h3>整改建议</h3><p>1. 补齐大额采购比价材料；2. 统一参考文献格式；3. 补充数据共享授权说明；4. 结题前完成待报销票据处理。</p>`;
    XQ.exportWord('科研项目合规报告', html);
  });

  XQ.researchUI = {
    newProject: () => { ui.tab.research = 'projects'; ui.researchProject = null; projectForm(); }
  };

  /* ---------- view ---------- */
  XQ.views.research = function () {
    const t = ui.tab.research;
    let body = '';
    if (t === 'dashboard') body = dashboard();
    else if (t === 'projects') body = ui.researchProject && projectById(ui.researchProject) ? projectDetail(projectById(ui.researchProject)) : projectsPage();
    else if (t === 'literature') body = literaturePage();
    else if (t === 'funds') body = fundsPage();
    else if (t === 'proposal') body = proposalPage();
    else if (t === 'format') body = formatPage();
    else if (t === 'outputs') body = outputsPage();
    else body = compliancePage();
    return head() + body;
  };
})();

</script>
<script>/* study.js */
/* 小青 1.0 · 学习助手 */
(function () {
  const XQ = window.XQ;
  const S = () => XQ.store.state;
  const ST = () => S().study;
  const q = XQ.esc;
  const TODAY = () => XQ.dt.todayISO();
  const ui = XQ.ui;
  ui.studyCourse = ui.studyCourse || 'c1';
  ui.studyNote = ui.studyNote || 's1';
  ui.treeOpen = ui.treeOpen || {};
  ui.mmLayout = ui.mmLayout || 'tree';
  ui.mmNode = ui.mmNode || null;
  ui.mergeMode = ui.mergeMode || 'vertical';
  ui.mergeSel = ui.mergeSel || [];
  ui.moocSubject = ui.moocSubject || 'all';
  ui.moocGoal = ui.moocGoal || 'sync';
  ui.moocPath = ui.moocPath || [];
  ui.resAuth = ui.resAuth || 'all';
  ui.resQ = ui.resQ || '';
  ui.resSavedOnly = ui.resSavedOnly || false;
  ui.quiz = ui.quiz || { noteId: 's1', answers: {}, submitted: false };
  ui.rec = ui.rec || { recording: false, sec: 0, segs: [], stopped: false };
  ui.audio = ui.audio || { id: null, sec: 0, timer: null };
  ui.kgNode = ui.kgNode || null;

  const TABS = [
    ['courses', 'grid', '学习空间'],
    ['record', 'mic', '录音转纪要'],
    ['notes', 'file', '纪要库'],
    ['mindmap', 'brain', '思维导图'],
    ['merge', 'layers', '合并整理'],
    ['mooc', 'play', '公开课'],
    ['resources', 'cloud', '资料库'],
    ['active', 'target', '主动助学']
  ];

  function head() {
    return `<div class="page-head"><div><div class="page-title">学习助手 <span class="tag-demo" title="ASR、OCR、爬虫与大模型生成内容为模拟演示">AI 助学空间</span></div>
      <div class="page-desc">课堂录音转结构化纪要、纪要生成思维导图、多份资料合并、公开课推荐与主动复习。所有学习资料按「学科 → 课程 → 章节 → 资源」四级组织。</div></div>
      <div class="page-actions">
        <button class="btn" data-act="study.exportWeek">${XQ.icon('download')}导出学习周报</button>
        <button class="btn" data-act="openAssistant">${XQ.icon('sparkle')}问小青</button>
        <button class="btn primary" data-act="study.recordStart">${XQ.icon('mic')}开始录音</button>
      </div></div>
      <div class="tabs">${TABS.map(t => `<button class="tab ${ui.tab.study === t[0] ? 'active' : ''}" data-act="study.tab" data-tab="${t[0]}">${XQ.icon(t[1], 15)}${t[2]}${t[0] === 'merge' && ui.mergeSel.length ? `<span class="count">${ui.mergeSel.length}</span>` : ''}</button>`).join('')}</div>`;
  }
  XQ.on('study.tab', el => {
    if (ui.tab.study === 'record' && ui.rec.recording) stopRec(false);
    ui.tab.study = el.dataset.tab;
    XQ.render();
  });

  function stat(label, value, hint, icon) {
    return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-hint">${hint}</div><div class="stat-ico">${XQ.icon(icon, 16)}</div></div>`;
  }
  function courseById(id) { return ST().courses.find(c => c.id === id); }
  function noteById(id) { return ST().notes.find(n => n.id === id); }
  function notesOf(courseId) { return ST().notes.filter(n => n.courseId === courseId); }
  function courseOfNote(n) { return n ? courseById(n.courseId) : null; }
  function avgMastery() { const cs = ST().courses; return Math.round(cs.reduce((s, c) => s + c.mastery, 0) / cs.length); }
  function rich(t) { return q(t).replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>'); }
  function secToHM(s) { return XQ.dt.hm ? XQ.dt.hm(Math.floor(s / 60)) : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function durationSec(str) { const p = String(str).split(':'); return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0); }
  function fmtSec(s) { return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }

  /* ================= courses / space ================= */
  function coursesPage() {
    const c = courseById(ui.studyCourse) || ST().courses[0];
    const cs = notesOf(c.id);
    return `<div class="stat-grid">
        ${stat('已建课程', ST().courses.length, '本学期 4 门核心课程', 'book')}
        ${stat('课程纪要', ST().notes.length, 'AI 生成 · 可回溯录音', 'file')}
        ${stat('知识节点', ST().graph.length, '图谱中已建立关联', 'brain')}
        ${stat('平均掌握度', avgMastery() + '%', '按练习与复习行为计算', 'target')}
      </div>
      <div class="grid-4" style="margin-top:16px">${ST().courses.map(x => `<div class="card card-pad" style="cursor:pointer;border-color:${x.id === c.id ? x.color : 'var(--line)'};background:${x.id === c.id ? x.color + '08' : '#fff'}" data-act="study.pickCourse" data-id="${x.id}">
        <div class="row" style="gap:9px"><div class="mc-ico" style="background:${x.color}15;color:${x.color};flex:0 0 34px;width:34px;height:34px;font-size:15px">${x.icon}</div><div style="flex:1;min-width:0"><b class="small" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${q(x.name)}</b><div class="tiny muted">${q(x.teacher)} · ${x.chapters} 章</div></div></div>
        <div class="progress thin" style="margin-top:11px"><i style="width:${x.mastery}%;background:${x.color}"></i></div>
        <div class="row tiny muted" style="margin-top:5px"><span>掌握度 ${x.mastery}%</span><span class="spacer"></span><span>${x.hours} 小时</span></div></div>`).join('')}</div>
      <div class="grid-2" style="grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);margin-top:16px;align-items:start">
        <div class="card card-pad"><div class="card-head"><div><div class="card-title">${XQ.icon('layers', 16)}${q(c.name)} · 知识树</div><div class="card-sub">${q(c.intro)}</div></div><span class="badge" style="background:${c.color}15;color:${c.color}">四级结构</span></div>
          <div class="tree">${c.tree.map((ch, ci) => {
            const key = c.id + '-' + ci;

  function mmColor(level, i) { return ['#0f9d76', '#2f7ceb', '#7a5cf0', '#e8912d', '#e0576b'][level === 0 ? 0 : (i % 4) + 1]; }
  function mmTreeSVG(note) {
    const root = note.mindmap;
    const branches = root.children || [];
    const W = 860, H = Math.max(420, branches.length * 104 + 60);
    const rootX = 34, rootY = H / 2 - 15;
    const l1X = 236, l2X = 486;
    let nodes = `<g class="mm-node" data-act="study.mmNode" data-name="${q(root.name)}"><rect x="${rootX}" y="${rootY}" width="126" height="34" rx="10" fill="#0f9d76"/><circle cx="${rootX + 16}" cy="${rootY + 17}" r="4" fill="#a9f0d9"/><text x="${rootX + 30}" y="${rootY + 21}" font-size="12" fill="#fff" font-weight="600">${q(root.name.slice(0, 9))}</text></g>`;
    let edges = '', childNodes = '';
    branches.forEach((b, i) => {
      const y = 42 + i * (H - 72) / Math.max(1, branches.length - 1 || 1);
      const color = mmColor(1, i);
      edges += `<path d="M${rootX + 126},${rootY + 17} C${rootX + 176},${rootY + 17} ${l1X - 36},${y + 14} ${l1X},${y + 14}" stroke="${color}" stroke-width="1.6" fill="none" opacity=".55"/>`;
      nodes += `<g class="mm-node" data-act="study.mmNode" data-name="${q(b.name)}"><rect x="${l1X}" y="${y}" width="128" height="29" rx="8" fill="${color}" opacity=".13"/><rect x="${l1X}" y="${y}" width="3.5" height="29" rx="2" fill="${color}"/><circle cx="${l1X + 15}" cy="${y + 14.5}" r="4" fill="${color}"/><text x="${l1X + 26}" y="${y + 18.5}" font-size="11.5" fill="#2b3935" font-weight="600">${q(b.name.slice(0, 10))}</text></g>`;
      const kids = b.children || [];
      kids.forEach((k, j) => {
        const ky = y + 14 + (j - (kids.length - 1) / 2) * 27;
        edges += `<path d="M${l1X + 128},${y + 14} C${l1X + 176},${y + 14} ${l2X - 24},${ky} ${l2X},${ky}" stroke="#d3e2dc" stroke-width="1.2" fill="none"/>`;
        nodes += `<g class="mm-node" data-act="study.mmNode" data-name="${q(k.name)}"><rect x="${l2X}" y="${ky - 10}" width="${Math.max(88, Math.min(150, 42 + k.name.length * 11))}" height="21" rx="6" fill="#fff" stroke="#dfeae6"/><text x="${l2X + 9}" y="${ky + 4}" font-size="10" fill="#4f625c">${q(k.name.slice(0, 12))}</text></g>`;
      });
    });
    return `<svg id="mindSvg" viewBox="0 0 ${W} ${H}" width="100%" height="${Math.min(560, H)}" style="min-width:720px">${edges}${nodes}</svg>`;
  }
  function mmFishbone(note) {
    const root = note.mindmap;
    const branches = root.children || [];
    const W = 900, H = 500, midY = 250;
    let out = `<path d="M50,${midY} H850" stroke="#bfd9cf" stroke-width="2"/><path d="m850,${midY} 12,-6 v12 z" fill="#bfd9cf"/>`;
    out += `<g class="mm-node" data-act="study.mmNode" data-name="${q(root.name)}"><rect x="28" y="${midY - 20}" width="118" height="40" rx="10" fill="#0f9d76"/><text x="42" y="${midY + 5}" font-size="12" fill="#fff" font-weight="600">${q(root.name.slice(0, 9))}</text></g>`;
    branches.forEach((b, i) => {
      const x = 220 + i * 165, up = i % 2 === 0, dir = up ? -1 : 1;
      const by = midY + dir * 122, color = mmColor(1, i);
      out += `<path d="M${x},${midY} L${x - 26},${by}" stroke="${color}" stroke-width="1.6" opacity=".55"/><circle cx="${x}" cy="${midY}" r="4" fill="${color}"/>`;
      out += `<g class="mm-node" data-act="study.mmNode" data-name="${q(b.name)}"><rect x="${x - 74}" y="${by - 15}" width="112" height="30" rx="8" fill="${color}" opacity=".14"/><text x="${x - 28}" y="${by + 4}" font-size="11.5" fill="#2b3935" font-weight="600" text-anchor="middle">${q(b.name.slice(0, 8))}</text></g>`;
      (b.children || []).forEach((k, j) => {
        out += `<text x="${x - 62 + (j % 2) * 66}" y="${by + dir * (38 + Math.floor(j / 2) * 20)}" font-size="9.5" fill="#6b7c76" text-anchor="middle" style="cursor:pointer" data-act="study.mmNode" data-name="${q(k.name)}">${q(k.name.slice(0, 8))}</text>`;
      });
    });
    return `<svg id="mindSvg" viewBox="0 0 ${W} ${H}" width="100%" height="440" style="min-width:760px">${out}</svg>`;

  XQ.on('study.mmNote', el => { ui.studyNote = el.value; ui.mmNode = null; XQ.render(); });

  /* ================= merge ================= */
  function mergeSelected() { return ui.mergeSel.map(id => noteById(id)).filter(Boolean); }
  function mergeCats(notes) {
    const cats = {};
    notes.forEach((n, ni) => (n.mindmap.children || []).forEach(b => {
      if (!cats[b.name]) cats[b.name] = [];
      cats[b.name].push({ ni, note: n, kids: (b.children || []).map(k => k.name) });
    }));
    return cats;
  }
  function mergePage() {
    const notes = mergeSelected();
    const cats = mergeCats(notes);
    const catNames = Object.keys(cats);
    const conflicts = catNames.filter(c => cats[c].length < notes.length).length;
    const same = catNames.filter(c => cats[c].length === notes.length).length;

      <div class="grid-2" style="grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:start">

            return `<div style="padding:9px 0;border-bottom:1px solid var(--line-2)"><div class="row"><b class="small">${q(c)}</b><span class="spacer"></span><span class="badge ${all ? 'green' : 'amber'}">${all ? '共同主题' : '仅 ' + cats[c].length + ' 份涉及'}</span></div><div class="row wrap" style="gap:5px;margin-top:6px">${Array.from(new Set(cats[c].flatMap(x => x.kids))).map(k => `<span class="chip soft">${q(k)}${cats[c].filter(x => x.kids.indexOf(k) >= 0).length < notes.length ? '<i style="color:var(--amber);font-style:normal">·</i>' : ''}</span>`).join('')}</div><div class="tiny muted" style="margin-top:4px">来源：${cats[c].map(x => '纪要' + (x.ni + 1)).join('、')}</div></div>`;
          }).join('')}</div><div class="row" style="margin-top:10px"><span class="badge green">共同 ${same}</span><span class="badge amber">差异 ${conflicts}</span><span class="badge gray">主题 ${catNames.length}</span><span class="spacer"></span><button class="btn sm primary" data-act="study.mergeConfirm">${XQ.icon('check', 14)}确认合并入库</button></div>` : `<div class="table-wrap"><table class="table"><thead><tr><th>知识点 / 维度</th>${notes.map((n, i) => `<th>纪要 ${i + 1}</th>`).join('')}</tr></thead><tbody>
            ${Array.from(new Set(notes.flatMap(n => n.keywords))).slice(0, 10).map(k => {
              const hit = notes.map(n => n.keywords.indexOf(k) >= 0 || n.summary.join('').indexOf(k) >= 0);
              const all = hit.every(Boolean);
              return `<tr><td>${q(k)}</td>${hit.map((h, i) => `<td>${h ? '<span class="badge green">覆盖</span>' : '<span class="badge gray">—</span>'}</td>`).join('')}</tr>`;
            }).join('')}
            <tr><td>掌握度</td>${notes.map(n => `<td><b>${n.mastery}%</b></td>`).join('')}</tr>
            <tr><td>转写片段</td>${notes.map(n => `<td>${n.segments.length} 段</td>`).join('')}</tr>
            <tr><td>核心主题</td>${notes.map(n => `<td>${q(n.mindmap.name)}</td>`).join('')}</tr>
          </tbody></table></div><div class="demo-note" style="margin-top:10px">${XQ.icon('info')}<div>横向对比帮助你发现多堂课之间的知识覆盖差异，冲突项会高亮显示。</div></div>`}
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="card card-pad"><div class="card-title" style="margin-bottom:9px">${XQ.icon('layers', 16)}差异视图</div>
            <div class="merge-diff">${catNames.map(c => { const cnt = cats[c].length; const type = cnt === notes.length ? 'same' : cnt === 1 ? 'add' : 'conflict'; return `<div class="diff-row ${type}"><span class="diff-type">${({ same: '重合', add: '新增', conflict: '差异' })[type]}</span><div style="flex:1"><b>${q(c)}</b><div class="tiny muted" style="margin-top:2px">${cnt === notes.length ? '所有纪要均涉及，可合并为共同节点' : '仅出现在 ' + cats[c].map(x => '纪要' + (x.ni + 1)).join('、') + '，建议保留并标注来源'}</div></div></div>`; }).join('')}
              ${notes.some(n => n.mastery < 60) ? `<div class="diff-row conflict"><span class="diff-type">薄弱</span><div style="flex:1"><b>掌握度不一致</b><div class="tiny muted" style="margin-top:2px">${notes.filter(n => n.mastery < 60).map(n => q(n.title) + '（' + n.mastery + '%）').join('；')}，建议优先复习</div></div></div>` : ''}

  XQ.on('study.mergeToggle', el => {

    const notes = mergeSelected(); const cats = mergeCats(notes);
    const lines = ['# 多纪要合并大纲', '', ...notes.map(n => '来源：' + n.course + ' · ' + n.title), ''];
    Object.keys(cats).forEach(c => { lines.push('## ' + c); Array.from(new Set(cats[c].flatMap(x => x.kids))).forEach(k => lines.push('- ' + k)); });
    XQ.download('多纪要合并大纲.md', lines.join('\n'), 'text/markdown');
  });
  XQ.on('study.mergeConfirm', () => {
    const notes = mergeSelected();
    if (notes.length < 2) { XQ.toast('至少选择 2 份纪要', 'warn'); return; }
    const cats = mergeCats(notes);
    const merged = {
      id: XQ.uid('sm'), courseId: notes[0].courseId, course: notes[0].course,
      title: '多纪要合并 · ' + notes.map(n => n.mindmap.name).join(' + ').slice(0, 24),

      keywords: Array.from(new Set(notes.flatMap(n => n.keywords))),

      qa: notes.flatMap(n => n.qa).slice(0, 6),

      quiz: notes.flatMap(n => n.quiz).slice(0, 8),
      mastery: Math.round(notes.reduce((s, n) => s + n.mastery, 0) / notes.length)
    };
    ST().notes.unshift(merged);
    ui.studyNote = merged.id;
    ui.mergeSel = [];
    ui.tab.study = 'notes';
    XQ.store.save(); XQ.render();

  /* ================= mooc ================= */
  const MOOC_SUBJECTS = { all: '全部', math: '数学', physics: '物理', cs: '计算机', marx: '思政' };
  function moocSubject(m) {
    if (/物理/.test(m.title)) return 'physics';
    if (/高数|微积分|线性代数|数学/.test(m.title)) return 'math';
    if (/数据结构|计算机|编程/.test(m.title)) return 'cs';
    if (/马克思|思政|马原/.test(m.title)) return 'marx';
    return 'other';
  }
  function moocPage() {
    let list = ST().moocs.filter(m => ui.moocSubject === 'all' || moocSubject(m) === ui.moocSubject);
    list = list.map(m => {
      let bonus = 0;
      if (ui.moocGoal === 'weak') bonus = m.hours <= 40 || /国防|基础/.test(m.title + m.school) ? 7 : 0;
      else if (ui.moocGoal === 'kaoyan') bonus = /清华|考研|理论/.test(m.title + m.reason) ? 8 : 0;
      else bonus = m.plat === '中国大学MOOC' ? 5 : 1;
      return Object.assign({}, m, { adj: Math.min(99, m.match + bonus) });
    }).sort((a, b) => b.adj - a.adj);
    const totalH = ui.moocPath.reduce((s, t) => s + t.hours, 0);

          <div class="ai-text" style="margin-top:10px"><div class="at-head">${XQ.icon('sparkle')}推荐策略</div>你当前「高等数学」掌握度 72%，极限与等价无穷小偏弱；「大学物理」掌握度 58%。建议先补高数基础，再同步大学物理。${ui.moocGoal === 'kaoyan' ? '若以考研为目标，可优先选择理论深度更高的课程。' : '每天 40 分钟，两周可完成一个专题。'}</div>
        </div>

          </div>
          <div class="card card-pad"><div class="card-head"><div><div class="card-title">${XQ.icon('alert', 16)}错题本</div><div class="card-sub">点击查看解析与变式</div></div><span class="badge rose">${ST().mistakes.length}</span></div>
            ${ST().mistakes.slice(0, 3).map((m, i) => `<div class="row" style="gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2);cursor:pointer" data-act="study.mistakeDetail" data-i="${i}"><div style="flex:1;min-width:0"><div class="small" style="font-weight:550;line-height:1.5">${q(m.q)}</div><div class="tiny muted">你答 ${q(m.wrong)} · 正确 ${q(m.right)}</div></div>${XQ.icon('right', 12)}</div>`).join('')}
          </div>
        </div>
      </div>`;
  }
  XQ.on('study.quizNote', el => { ui.quiz = { noteId: el.value, answers: {}, submitted: false }; XQ.render(); });
  XQ.on('study.answer', el => {
    if (ui.quiz.submitted) return;
    ui.quiz.answers[Number(el.dataset.q)] = Number(el.dataset.o);
    XQ.render();
  });
  XQ.on('study.submitQuiz', () => {
    const n = quizNote();
    if (!n) return;
    const qs = n.quiz;
    if (Object.keys(ui.quiz.answers).length < qs.length) { XQ.toast('还有题目未作答', 'warn'); return; }
    ui.quiz.submitted = true;
    const score = qs.reduce((s, x, i) => s + (ui.quiz.answers[i] === x.answer ? 1 : 0), 0);
    qs.forEach((x, i) => {
      if (ui.quiz.answers[i] !== x.answer && !ST().mistakes.some(m => m.q === x.q)) {
        ST().mistakes.unshift({ q: x.q, wrong: x.opts[ui.quiz.answers[i]], right: x.opts[x.answer], note: x.explain, date: TODAY() });
      }
    });
    XQ.store.save(); XQ.render();
    XQ.toast('得分 ' + score + ' / ' + qs.length + '，错题已自动收录');
  });
  XQ.on('study.resetQuiz', () => { ui.quiz.answers = {}; ui.quiz.submitted = false; XQ.render(); });
  XQ.on('study.nextQuiz', () => {
    const idx = ST().notes.findIndex(n => n.quiz.length > 0);
    const withQuiz = ST().notes.filter(n => n.quiz.length > 0);
    if (!withQuiz.length) return;
    const cur = withQuiz.findIndex(n => n.id === ui.quiz.noteId);
    const next = withQuiz[(cur + 1) % withQuiz.length];
    ui.quiz = { noteId: next.id, answers: {}, submitted: false };
    ui.studyNote = next.id;
    XQ.render(); XQ.toast('已切换到「' + next.title + '」的题目');
  });
  XQ.on('study.genQuiz', () => {
    XQ.toast('正在根据课堂关键词生成变式题…');
    setTimeout(() => {
      const n = quizNote();
      if (n && n.quiz.length < 5) {
        n.quiz.push({ q: '下列关于「' + (n.keywords[0] || '本节概念') + '」的说法，正确的是？', opts: ['与本节内容无关', '是本节的核心概念之一', '只在考试中出现', '无法验证'], answer: 1, explain: '该关键词由课堂纪要自动抽取，属于本节重点内容。' });
      }
      XQ.store.save(); XQ.render(); XQ.toast('已补充生成题目');
    }, 700);
  });
  XQ.on('study.kgNode', el => { ui.kgNode = el.dataset.id; XQ.render(); });
  XQ.on('study.kgReview', el => {
    const g = ST().graph.find(x => x.id === el.dataset.id);
    if (!g) return;
    if (ST().reviewPlan.some(r => r.title === g.name)) { XQ.toast('该知识点已在复习计划中'); return; }
    ST().reviewPlan.push({ title: g.name, due: XQ.D(1), level: g.mastery < 40 ? '弱' : '中', course: '高等数学（上）' });
    XQ.store.save(); XQ.render(); XQ.toast('已加入明日复习计划');
  });
  XQ.on('study.mistakeDetail', el => {
    const m = ST().mistakes[Number(el.dataset.i)];
    if (!m) return;
    XQ.modal({ title: '错题解析', sub: m.date, body: `<div class="small" style="font-weight:600;line-height:1.7">${q(m.q)}</div><div class="grid-2" style="gap:10px;margin-top:12px"><div class="card card-pad" style="border-color:#f0b3bc;background:#fff7f8"><div class="tiny muted">你的答案</div><b style="color:#c23c50">${q(m.wrong)}</b></div><div class="card card-pad" style="border-color:#a9e5d0;background:#f5fdfa"><div class="tiny muted">正确答案</div><b style="color:#0a7355">${q(m.right)}</b></div></div><div class="q-explain" style="margin-top:12px"><b>解析：</b>${q(m.note)}</div><div class="ai-text" style="margin-top:10px"><div class="at-head">${XQ.icon('sparkle')}变式练习</div>小青已生成 2 道同知识点变式题，可在主动助学中练习。</div>`, footer: '<button class="btn" data-close>关闭</button><button class="btn primary" data-act="study.practiceMistake">生成变式题</button>' });
  });
  XQ.on('study.practiceMistake', () => { XQ.closeModal(); XQ.toast('变式题已加入练习队列'); });
  XQ.on('study.oral', el => {
    const n = noteById(el.dataset.id) || quizNote();
    if (!n) return;
    const qa = n.qa.length ? n.qa : [{ q: '请用一句话概括本节课的核心内容。', a: n.summary[0] }];
    let idx = 0;
    XQ.modal({
      title: '口试式复习', sub: '小青提问，你用自己的话回答 · 演示',
      body: `<div id="oralBox" style="max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px"><div class="ai-text"><div class="at-head">${XQ.icon('sparkle')}第 1 题</div>${q(qa[0].q)}</div></div><div class="row" style="gap:7px;margin-top:10px"><input class="input" id="oralInput" placeholder="输入你的回答…" style="flex:1"><button class="btn primary sm" id="oralSend">${XQ.icon('send', 13)}回答</button></div><div class="tiny muted" style="margin-top:6px">提示：回答不必逐字背诵，能说出关键词与逻辑关系即可。</div>`,
      footer: '<button class="btn" data-close>结束复习</button>',
      onMount: mask => {
        const box = mask.querySelector('#oralBox'), input = mask.querySelector('#oralInput');
        const send = () => {
          const text = input.value.trim();
          if (!text) return;
          box.insertAdjacentHTML('beforeend', `<div style="align-self:flex-end;max-width:86%;background:var(--primary);color:#fff;padding:9px 12px;border-radius:11px 11px 3px 11px;font-size:11.5px;line-height:1.65">${q(text)}</div>`);
          input.value = '';
          const cur = qa[idx];
          const good = text.length >= 12;
          box.insertAdjacentHTML('beforeend', `<div class="ai-text"><div class="at-head">${XQ.icon('sparkle')}小青反馈</div>${good ? '回答抓住了关键点。' : '回答略简短，可以再补充定义或条件。'}参考答案：${q(cur.a)}</div>`);
          idx++;
          if (idx < qa.length) {
            box.insertAdjacentHTML('beforeend', `<div class="ai-text"><div class="at-head">${XQ.icon('sparkle')}第 ${idx + 1} 题</div>${q(qa[idx].q)}</div>`);
          } else {
            box.insertAdjacentHTML('beforeend', `<div class="ai-text"><div class="at-head">${XQ.icon('check')}本轮完成</div>你已完成 ${qa.length} 道口试题，建议把不熟的关键词加入复习计划。</div>`);
          }
          box.scrollTop = box.scrollHeight;
        };
        mask.querySelector('#oralSend').addEventListener('click', send);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
        input.focus();
      }
    });
  });

  /* ================= weekly export ================= */
  XQ.on('study.exportWeek', () => {
    const hours = ST().courses.reduce((s, c) => s + c.hours, 0);
    const weekNotes = ST().notes.filter(n => n.date >= XQ.D(-7));
    const html = `<h2>小青 · 学习周报</h2><p style="text-indent:0">统计周期：${XQ.D(-7)} 至 ${TODAY()}　学生：${q(S().user.name)}</p><table><thead><tr><th>指标</th><th>数值</th></tr></thead><tbody><tr><td>课堂学习时长</td><td>${hours} 小时</td></tr><tr><td>新增纪要</td><td>${weekNotes.length} 份</td></tr><tr><td>课程平均掌握度</td><td>${avgMastery()}%</td></tr><tr><td>待复习知识点</td><td>${ST().reviewPlan.length} 个</td></tr><tr><td>错题数量</td><td>${ST().mistakes.length} 道</td></tr></tbody></table><h3>课程掌握情况</h3><table><thead><tr><th>课程</th><th>章节</th><th>掌握度</th><th>学习时长</th></tr></thead><tbody>${ST().courses.map(c => `<tr><td>${q(c.name)}</td><td>${c.chapters}</td><td>${c.mastery}%</td><td>${c.hours} 小时</td></tr>`).join('')}</tbody></table><h3>下周建议</h3><p>1. 优先复习掌握度低于 40% 的知识点：${ST().reviewPlan.filter(r => r.level === '弱').map(r => r.title).join('、') || '暂无'}；<br>2. 完成 ${ST().todos.filter(t => !t.done).length} 项未完成待办；<br>3. 每天安排 30 分钟主动回忆练习，优先使用口试式复习。</p>`;
    XQ.exportWord('小青学习周报', html);
  });

  /* ================= view ================= */
  XQ.views.study = function () {
    if (ui.tab.study !== 'record' && ui.rec && ui.rec.recording) stopRec(true);
    if (ui.tab.study !== 'notes' && ui.audio.timer) stopAudio();
    const t = ui.tab.study;
    let body = '';
    if (t === 'courses') body = coursesPage();
    else if (t === 'record') body = recordPage();
    else if (t === 'notes') body = notesPage();
    else if (t === 'mindmap') body = mindmapPage();
    else if (t === 'merge') body = mergePage();
    else if (t === 'mooc') body = moocPage();
    else if (t === 'resources') body = resourcesPage();
    else body = activePage();
    return head() + body;
  };
  XQ.studyUI = {
    record: () => startRec(),
    tab: t => { ui.tab.study = t; XQ.render(); }
  };
})();

</script>
<script>XQ.boot();</script>


</body></html>
